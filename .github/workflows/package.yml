name: Package seekdb
run-name: Package ${{ inputs.platform }} / ${{ inputs.linux_glibc }} / ${{ inputs.version || 'source version' }}-${{ inputs.release }}

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to build
        type: choice
        default: linux-x86_64
        options: [all, linux-x86_64, linux-aarch64, macos-arm64, windows-x86_64, android-arm64]
      linux_glibc:
        description: Linux compatibility baseline
        type: choice
        default: '2.17'
        options: ['2.17', '2.28', both]
      version:
        description: Package version (empty uses the source version)
        type: string
      release:
        description: Package release
        type: string
        default: '1'
      formats:
        description: Linux system packages (all choices also export the binary archive)
        type: choice
        default: all
        options: [all, binary, rpm, deb]
      jobs:
        description: Local build parallelism (0 selects hosted-runner defaults)
        type: number
        default: 0

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}-${{ inputs.platform }}-${{ inputs.linux_glibc }}
  cancel-in-progress: false

env:
  RUSTUP_DIST_SERVER: https://static.rust-lang.org
  RUSTUP_UPDATE_ROOT: https://static.rust-lang.org/rustup
  RUSTUP_INIT_URL: https://sh.rustup.rs

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      linux_matrix: ${{ steps.matrix.outputs.linux_matrix }}
      has_linux: ${{ steps.matrix.outputs.has_linux }}
      version: ${{ steps.matrix.outputs.version }}
      release: ${{ steps.matrix.outputs.release }}
      jobs: ${{ steps.matrix.outputs.jobs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select and validate targets
        id: matrix
        env:
          PACKAGE_PLATFORM: ${{ inputs.platform }}
          PACKAGE_GLIBC: ${{ inputs.linux_glibc }}
          PACKAGE_VERSION: ${{ inputs.version }}
          PACKAGE_RELEASE: ${{ inputs.release }}
          BUILD_JOBS: ${{ inputs.jobs }}
        run: python3 .github/scripts/package.py matrix

  binary:
    name: binary-${{ matrix.id }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      PACKAGE_OS: ${{ matrix.os }}
      PACKAGE_ARCH: ${{ matrix.arch }}
      PACKAGE_GLIBC: ${{ matrix.glibc }}
      LINUX_PROFILE: ${{ matrix.profile }}
      PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
      PACKAGE_RELEASE: ${{ needs.prepare.outputs.release }}
      BUILD_JOBS: ${{ needs.prepare.outputs.jobs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Free unused tools on disposable Linux runners
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h "$GITHUB_WORKSPACE"
      - name: Set up Windows build utilities
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & C:\msys64\usr\bin\bash.exe -lc 'pacman -S --needed --noconfirm make'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'C:\msys64\usr\bin' >> $env:GITHUB_PATH
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Install Linux build utilities
        if: matrix.os == 'linux'
        run: sudo apt-get update -qq && sudo apt-get install -y rpm2cpio cpio make binutils patchelf
      - name: Set up Conda sysroot
        id: conda
        if: matrix.os == 'linux'
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3
        with:
          micromamba-version: ${{ matrix.micromamba }}
          micromamba-root-path: ${{ github.workspace }}/.ci-cache/micromamba
          environment-name: sysroot
          create-args: >-
            --override-channels -c conda-forge --strict-channel-priority
            ${{ matrix.conda_spec }}
          init-shell: none
          generate-run-shell: false
          cache-downloads: false
          cache-environment: false
      - name: Validate sysroot and configure Clang
        if: matrix.os == 'linux'
        env:
          CONDA_ENVIRONMENT: ${{ steps.conda.outputs.environment-path }}
        run: python .github/scripts/package.py sysroot
      - name: Configure dependency cache key
        id: keys
        run: python .github/scripts/package.py environment
      - name: Restore dependency SDK
        id: sdk
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps/3rd
            deps/android
          key: package-sdk-v1-${{ matrix.id }}-${{ steps.keys.outputs.sdk }}
          restore-keys: package-sdk-v1-${{ matrix.id }}-
      - name: Initialize dependencies
        run: python .github/scripts/package.py initialize
      - name: Save initialized SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps/3rd
            deps/android
          key: ${{ steps.sdk.outputs.cache-primary-key }}
      - name: Compile seekdb once
        id: build
        run: python .github/scripts/package.py build
      - name: Export verified binary distribution
        run: python .github/scripts/package.py export
      - name: Upload binary distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binary-${{ matrix.id }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Stop Bazel
        if: always() && steps.build.outcome != 'skipped'
        run: python .github/scripts/package.py shutdown

  system-packages:
    name: rpm-deb-${{ matrix.id }}
    needs: [prepare, binary]
    if: always() && !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.has_linux == 'true' && inputs.formats != 'binary'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.linux_matrix) }}
    env:
      PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
      PACKAGE_RELEASE: ${{ needs.prepare.outputs.release }}
      PACKAGE_FORMATS: ${{ inputs.formats }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: binary-${{ matrix.id }}
          path: input
      - name: Install packaging tools
        run: sudo apt-get update -qq && sudo apt-get install -y rpm binutils dpkg-dev debugedit elfutils file
      - name: Package the existing binary without initializing or compiling
        run: |
          mkdir -p .ci-cache
          python3 .github/scripts/package.py system
      - name: Upload system packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: system-packages-${{ matrix.id }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
