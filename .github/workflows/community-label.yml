name: Community PR label

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  community-label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only use PR metadata; never check out or execute PR code here.
      - name: Label community-authored pull requests
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            // author_association is a heuristic, not an organization membership lookup.
            if (['MEMBER', 'OWNER'].includes(pr.author_association) || pr.user.type === 'Bot') {
              return;
            }

            const label = 'community';
            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              try {
                await github.rest.issues.createLabel({
                  ...context.repo,
                  name: label,
                  color: '0E8A16',
                  description: 'Community-authored pull requests',
                });
              } catch (error) {
                if (error.status !== 422) throw error;
                // Another run may have created it; verify that the label now exists.
                await github.rest.issues.getLabel({ ...context.repo, name: label });
              }
            }

            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: pr.number,
              labels: [label],
            });
