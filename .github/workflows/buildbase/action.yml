name: "Build base"

inputs:
  save_cache:
    description: 'retained for compatibility with existing callers'
    required: true
  os:
    description: 'retained for compatibility with existing callers'
    required: true

runs:
  using: "composite"
  steps:
    - name: Setup Rust
      uses: ./.github/actions/setup-rust

    # Fail fast: the crate's unit tests carry the ABI layout assertions and the
    # protocol/reactor suites; no point building the C++ tree against a broken
    # staticlib.
    - name: Rust unit tests
      shell: bash
      working-directory: rust
      # This workspace does not check in Cargo.lock. Resolve it on a fresh
      # checkout; subsequent ABI/differential checks use that generated lockfile.
      run: cargo test --workspace

    - name: Initialize release build
      shell: bash
      run: |
        if [[ -f ~/.bashrc ]]; then
          source ~/.bashrc
        fi
        ./build.sh release --init
        echo "$GITHUB_WORKSPACE/deps/3rd/usr/local/oceanbase/devtools/bin" >> "$GITHUB_PATH"

    - name: Build release Unity binary
      shell: bash
      run: |
        if [[ -f ~/.bashrc ]]; then
          source ~/.bashrc
        fi
        cd build_release && make -j4
        test -x src/observer/seekdb
        test -x src/observer/observer

    - name: Embedding C++ and Rust integration
      shell: bash
      run: |
        cmake --build build_release --target embedding_response_integration -j4
        build_release/src/observer/embedding_response_integration
        python3 rust/embedding-response/tests/compare_cpp.py --adapter-probe build_release/src/observer/embedding_response_integration
