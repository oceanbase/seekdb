name: "Build base"

inputs:
  save_cache:
    description: 'retained for compatibility with existing callers'
    required: true
  os:
    description: 'retained for compatibility with existing callers'
    required: true

runs:
  using: "composite"
  steps:
    - name: Setup Rust
      uses: ./.github/actions/setup-rust

    # Fail fast: catch a crate that does not compile before the C++ build.
    # ABI drift is caught by rust-checks' header drift check (nio.h is
    # cbindgen-generated), not by tests here.
    - name: Rust unit tests
      shell: bash
      working-directory: rust
      run: cargo test --locked -p sql-nio

    - name: Initialize release build
      shell: bash
      run: |
        if [[ -f ~/.bashrc ]]; then
          source ~/.bashrc
        fi
        ./build.sh release --init
        echo "$GITHUB_WORKSPACE/deps/3rd/usr/local/oceanbase/devtools/bin" >> "$GITHUB_PATH"

    - name: Build release Unity binary
      shell: bash
      run: |
        if [[ -f ~/.bashrc ]]; then
          source ~/.bashrc
        fi
        cd build_release && make -j4
        test -x src/observer/seekdb
        test -x src/observer/observer
