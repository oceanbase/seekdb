name: "Build base"

inputs:
  save_cache:
    description: 'retained for compatibility with existing callers'
    required: true
  os:
    description: 'retained for compatibility with existing callers'
    required: true

runs:
  using: "composite"
  steps:
    - name: Setup Rust
      uses: ./.github/actions/setup-rust

    # Fail fast: catch a crate that does not compile before the C++ build.
    # Generated ABI headers are checked by rust-checks.
    - name: Rust unit tests
      shell: bash
      working-directory: rust
      # This workspace does not check in Cargo.lock. Resolve it on a fresh
      # checkout before running the source-local unit tests.
      run: cargo test --workspace

    - name: Initialize release build
      shell: bash
      run: |
        if [[ -f ~/.bashrc ]]; then
          source ~/.bashrc
        fi
        ./build.sh release --init
        echo "$GITHUB_WORKSPACE/deps/3rd/usr/local/oceanbase/devtools/bin" >> "$GITHUB_PATH"

    - name: Build release Unity binary
      shell: bash
      run: |
        if [[ -f ~/.bashrc ]]; then
          source ~/.bashrc
        fi
        cd build_release && make -j4
        test -x src/observer/seekdb
        test -x src/observer/observer
