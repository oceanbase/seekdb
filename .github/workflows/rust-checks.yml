# Fast checks for every Rust workspace member without a full server build.
name: rust-checks

on:
  pull_request:
    paths:
      - 'rust/**'
      - 'bazel/cargo*'
      - 'bazel/cxx.bzl'
      - 'build.py'
      - 'deps/init/**'
      - 'MODULE.bazel'
      - '.github/workflows/rust-checks.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clippy-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Rust cache directories
        run: |
          echo "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" >> "$GITHUB_ENV"
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"

      - name: Cache Cargo registry and tools
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry/index
            ${{ env.CARGO_HOME }}/registry/cache
            ${{ env.CARGO_HOME }}/bin
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Prepare generated Rust configuration
        run: |
          ./build.py init
          ./build.py build //rust:config/generated_config.rs
          echo "CONFIG_RS=$PWD/build/bin/rust/config/generated_config.rs" >> "$GITHUB_ENV"

      - name: clippy (deny warnings)
        working-directory: rust
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Rust workspace tests
        working-directory: rust
        run: cargo test --locked --workspace

      # Compile Windows code on Linux; this does not run Windows tests.
      - name: check windows target
        working-directory: rust
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
          cargo check --locked --workspace --target x86_64-pc-windows-gnu

      - name: cargo audit
        working-directory: rust
        run: |
          command -v cargo-audit >/dev/null 2>&1 || cargo install cargo-audit --locked
          cargo audit
