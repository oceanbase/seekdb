# Rust checks: workspace-wide clippy and source-local unit tests,
# verification of the committed cbindgen-generated ABI headers, and
# a RustSec advisory audit of the locked dependency tree. This job gives
# rust-only PRs a fast signal without a full server build.
name: rust-checks

on:
  pull_request:
    paths:
      - 'rust/**'
      - '.github/workflows/rust-checks.yml'
      - '.github/actions/setup-rust/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clippy-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: clippy (deny warnings)
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The preceding unlocked clippy invocation resolves Cargo.lock on a fresh checkout.
      - name: Rust unit tests
        working-directory: rust
        run: cargo test --locked --workspace

      - name: generated headers are committed
        run: git diff --exit-code -- rust/sql-nio/include/nio.h rust/embedding-response/include/embedding.h

      # No Windows runner: a cross `cargo check` is the cheapest signal that
      # the cfg(windows) transport code still compiles. It would have caught
      # every break the TCP-only cut left behind. windows-gnu, not msvc:
      # ring's build script compiles C, and mingw is the only Windows C
      # toolchain this runner can provide (the cc crate auto-detects the
      # x86_64-w64-mingw32- prefix).
      - name: check windows target
        working-directory: rust
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64
          cargo check --workspace --target x86_64-pc-windows-gnu

      - name: cargo audit
        working-directory: rust
        run: |
          command -v cargo-audit >/dev/null 2>&1 || cargo install cargo-audit --locked
          cargo audit
