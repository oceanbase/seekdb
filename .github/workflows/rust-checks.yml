# Fast checks for every Rust workspace member without a full server build.
name: rust-checks

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'rust/**'
      - 'bazel/rust*'
      - 'package/ios/**'
      - 'bazel/cxx_runtime.BUILD.bazel'
      - 'deps/external/**'
      - 'bazel/cxx.bzl'
      - 'build.py'
      - 'deps/init/**'
      - 'MODULE.bazel'
      - 'MODULE.bazel.lock'
      - '.bazelrc'
      - '.github/workflows/rust-checks.yml'
      - '!**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clippy-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The image includes the Rust version pinned in rust-toolchain.toml.
      WINDOWS_CI_IMAGE: ghcr.io/oceanbase/seekdb-rust-windows-gnu@sha256:6fcb7032ed8625a2e9fa1da91ea40a08c6fc1b469a98b8e702bd1b0d05b453c2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Rust cache directories
        run: |
          echo "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" >> "$GITHUB_ENV"
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"

      - name: Cache Cargo registry and tools
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry/index
            ${{ env.CARGO_HOME }}/registry/cache
            ${{ env.CARGO_HOME }}/bin
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Initialize build dependencies
        run: ./build.py init

      - name: clippy (deny warnings)
        run: ./build.py build --lockfile_mode=error --config=clippy //rust/... //bazel/prost-codegen:prost_codegen

      - name: Expose generated sources to Cargo
        run: |
          echo "MVT_PROTO_RS=$PWD/build/bin/rust/mvt/generated/vector_tile.rs" >> "$GITHUB_ENV"
          echo "STANDBY_PROTO_RS=$PWD/build/bin/rust/standby-rpc/generated/standbyservice.rs" >> "$GITHUB_ENV"
          echo "CONFIG_RS=$PWD/build/bin/rust/config/generated_config.rs" >> "$GITHUB_ENV"

      - name: Rust workspace tests
        working-directory: rust
        run: cargo test --locked --workspace --exclude crypto --exclude http-client

      - name: Pull Windows GNU toolchain image
        run: docker pull "$WINDOWS_CI_IMAGE"

      # Compile Windows code on Linux; this does not run Windows tests.
      - name: check windows target
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" \
            --volume "$CARGO_HOME:/ci-cargo" \
            --workdir "$GITHUB_WORKSPACE/rust" \
            --env CARGO_HOME=/ci-cargo --env CARGO_TARGET_DIR=/tmp/target \
            --env RUSTUP_AUTO_INSTALL=0 --env MVT_PROTO_RS --env STANDBY_PROTO_RS --env CONFIG_RS \
            "$WINDOWS_CI_IMAGE" cargo check --locked --workspace --target x86_64-pc-windows-gnu

      - name: cargo audit
        run: |
          command -v cargo-audit >/dev/null 2>&1 || cargo install cargo-audit --locked
          cargo audit
