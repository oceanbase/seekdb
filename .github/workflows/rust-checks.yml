# Static analysis for the Rust transport crate: clippy as a hard gate and a
# RustSec advisory audit of the locked dependency tree. Unit tests run in
# buildbase alongside the C++ build; this job exists to give rust-only PRs a
# fast signal without a full server build.
name: rust-checks

on:
  pull_request:
    paths:
      - 'rust/**'
      - '.github/workflows/rust-checks.yml'
      - '.github/actions/setup-rust/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clippy-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: clippy (deny warnings)
        working-directory: rust
        run: cargo clippy --locked -p sql-nio --all-targets -- -D warnings

      # No Windows runner: a cross `cargo check` is the cheapest signal that
      # the cfg(windows) transport code still compiles. It would have caught
      # every break the TCP-only cut left behind. windows-gnu, not msvc:
      # ring's build script compiles C, and mingw is the only Windows C
      # toolchain this runner can provide (the cc crate auto-detects the
      # x86_64-w64-mingw32- prefix).
      - name: check windows target
        working-directory: rust
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64
          cargo check --locked -p sql-nio --target x86_64-pc-windows-gnu

      - name: cargo audit
        working-directory: rust
        run: |
          # The setup-rust cache restores $CARGO_HOME/bin as-is; a stale or
          # half-written cargo-audit binary can pass `command -v` yet fail to
          # run, and cargo install then refuses to overwrite it. Verify by
          # executing, and reinstall from scratch when the binary is broken.
          if ! cargo audit --version >/dev/null 2>&1; then
            rm -f "$(command -v cargo-audit)" 2>/dev/null || true
            cargo install cargo-audit --locked
          fi
          cargo audit
