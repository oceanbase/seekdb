# Fast checks for every Rust workspace member without a full server build.
name: rust-checks

on:
  pull_request:
    paths:
      - 'rust/**'
      - '.github/workflows/rust-checks.yml'
      - '.github/actions/setup-rust/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clippy-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: clippy (deny warnings)
        working-directory: rust
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Rust workspace tests
        working-directory: rust
        run: cargo test --locked --workspace

      - name: generated sources are committed
        run: git diff --exit-code -- rust

      # Compile Windows code on Linux; this does not run Windows tests.
      - name: check windows target
        working-directory: rust
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
          cargo check --locked --workspace --target x86_64-pc-windows-gnu

      - name: cargo audit
        working-directory: rust
        run: |
          command -v cargo-audit >/dev/null 2>&1 || cargo install cargo-audit --locked
          cargo audit
