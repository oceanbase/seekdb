name: seekdb-cli tests

on:
  pull_request:
    paths:
      - "tools/seekdb_cli.py"
      - "tools/seekdb-cli"
      - "tools/seekdb_cli_test.py"
      - ".github/workflows/seekdb-cli-tests.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  seekdb-cli-tests:
    name: Run seekdb-cli unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run seekdb-cli unit tests
        run: python3 tools/seekdb_cli_test.py
