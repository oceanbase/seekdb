# Build, pack and upload libseekdb for multiple platforms (linux x64/arm64, macos arm64, windows x64, android arm64-v8a) to S3
#
# All platforms build the Bazel target //src/observer:libseekdb through ./build.py (deps/3rd + Bazel 9.3),
# then package with package/libseekdb/libseekdb-build.sh (libseekdb-build.ps1 on Windows).
#
# Reference build environments (use these systems/env as the standard):
#   linux-x64:   runner ubuntu-22.04, container quay.io/pypa/manylinux_2_28_x86_64 (glibc 2.28+), zip libseekdb-linux-x64.zip
#   linux-arm64: runner ubuntu-22.04-arm, container quay.io/pypa/manylinux_2_28_aarch64 (glibc 2.28+), zip libseekdb-linux-arm64.zip
#   darwin-arm64: runner macos-15, native (min macOS 13.0), zip libseekdb-darwin-arm64.zip
#   windows-x64: runner windows-2022, python build.py + libseekdb-build.ps1, zip libseekdb-windows-x64.zip (seekdb.dll + libs/*.dll)
#   android-arm64-v8a: runner macos-15, NDK r27d + build.py --config=android, zip libseekdb-android-arm64-v8a.zip
#
# The Linux containers run Bazel because Bazel 9.3 does not support EL7 (glibc 2.17); manylinux_2_28 keeps the
# shipped libseekdb.so baseline at glibc 2.28 instead of the runner's glibc.
# macOS builds set macos_minimum_os=13.0 in .bazelrc, so the dylib runs on macOS 13 (Ventura) and later.
# On macOS, dylibs are signed in libseekdb-build.sh: ad-hoc when no cert; when repo is oceanbase/seekdb and secrets are set,
# use Developer ID (secrets: OSX_CODESIGN_BUILD_CERTIFICATE_BASE64, OSX_CODESIGN_P12_PASSWORD, OSX_CODESIGN_KEYCHAIN_PASSWORD, OSX_CODESIGN_IDENTITY).
# Optional: add notarization step and APPLE_ID/PASSWORD/TEAM_ID secrets to notarize the zip.
# Artifacts: platform zips including libseekdb-android-arm64-v8a.zip; combined artifact libseekdb-all-platforms; optional S3 upload when DESTINATION_TARGET_PATH or AWS_S3_BUCKET and credentials are set.
#
# Job step order (unified across linux/macos/android/windows): Checkout → caches → compile → setup Node/Rust/Go/Java →
# FFI binding tests (same step names/IDs on every platform; continue-on-error per language so all languages run; the final
# "Binding tests outcome" step fails the job if any binding test failed) → pack → verify packed artifact → upload artifact
# → save caches (always).
# Verify packed artifact: linux/macos run test-packed-artifact-smoke.sh (hard gate); windows runs the equivalent
# test-packed-artifact-smoke.ps1 (hard gate); android runs unzip -t.
# Platform differences (build invocation, toolchain install, Bazel/Rust caching) are confined to step bodies/scripts.
# Caches: deps/3rd (dependency SDK), .ci/bazel-{launcher,cache} (pinned Bazel + disk cache keyed on MODULE.bazel.lock),
# .ci/{cargo,rustup} (Rust SDK on the containerised Linux jobs; elsewhere the setup-rust action caches Cargo).
# Android: compile → setup toolchains → host-skip FFI notice → pack → verify zip → upload → save caches → summary (see job comment).
name: Build libseekdb
run-name: Build libseekdb for ${{ github.event_name == 'workflow_dispatch' && inputs.ref != '' && inputs.ref || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}

# PRs: pull_request. Direct pushes: only long-lived / release lines — avoids duplicate runs when the same commit
# is both "push" to a feature branch and "pull_request" sync (open PR to upstream from that branch).
# S3 upload still only on main, master, develop, *.*.x, integration/* (UPLOAD_S3; see release-artifacts job).
on:
  push:
    branches:
      - main
      - master
      - develop
      - "integration/**"
      - "release/**"
      # e.g. 1.0.x; aligns with S3 / UPLOAD_S3 for dot-x lines
      - "*.*.x"
    paths-ignore:
      - "*.md"
      - "LICENSE"
      - "CODEOWNERS"
      - "docs/**"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit SHA to build (empty = use default branch)"
        required: false
        type: string
        default: ""
  pull_request:
    paths-ignore:
      - "*.md"
      - "LICENSE"
      - "CODEOWNERS"
      - "docs/**"

env:
  COMMIT_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.ref != '' && inputs.ref || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
  UPLOAD_S3: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/integration/') || contains(github.ref, '.x'))) }}
  BUCKET_NAME: ${{ vars.AWS_S3_BUCKET || 'oceanbase-seekdb-builds' }}
  DESTINATION_TARGET_PATH: ${{ vars.DESTINATION_TARGET_PATH || format('s3://oceanbase-seekdb-builds/libseekdb/all_commits/{0}', github.event_name == 'workflow_dispatch' && inputs.ref != '' && inputs.ref || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha)) }}
  S3_BUCKET: ${{ vars.AWS_S3_BUCKET || 'oceanbase-seekdb-builds' }}
  S3_PREFIX: libseekdb/all_commits/${{ github.event_name == 'workflow_dispatch' && inputs.ref != '' && inputs.ref || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}

jobs:
  # ---------- Build libseekdb on Linux / macOS ----------
  build:
    name: Build libseekdb (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-22.04
            artifact_name: libseekdb-linux-x64
            container_image: quay.io/pypa/manylinux_2_28_x86_64
            deps_file: oceanbase.el8.x86_64.deps
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
            artifact_name: libseekdb-linux-arm64
            container_image: quay.io/pypa/manylinux_2_28_aarch64
            deps_file: oceanbase.el8.aarch64.deps

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_dispatch: use inputs.ref if set; PR: head sha; push: event sha
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref != '' && inputs.ref || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps/3rd
          key: ${{ runner.os }}-libseekdb-deps-${{ matrix.platform }}-el8-${{ hashFiles(format('deps/init/{0}', matrix.deps_file)) }}
          restore-keys: |
            ${{ runner.os }}-libseekdb-deps-${{ matrix.platform }}-el8-

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: |
            .ci/bazel-launcher
            .ci/bazel-cache
          key: ${{ runner.os }}-libseekdb-bazel-${{ matrix.platform }}-${{ hashFiles('MODULE.bazel.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-libseekdb-bazel-${{ matrix.platform }}-

      - name: Cache Rust SDK
        uses: actions/cache@v4
        with:
          path: |
            .ci/cargo
            .ci/rustup
          key: ${{ runner.os }}-libseekdb-rust-${{ matrix.platform }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-libseekdb-rust-${{ matrix.platform }}-

      # Bazel 9.3 does not run on EL7, so the build runs in manylinux_2_28 (glibc 2.28) instead; the zip keeps a
      # glibc 2.28 baseline rather than the ubuntu-22.04 runner's glibc. Node/actions still run on the host.
      - name: Build libseekdb
        run: |
          docker run --rm -u root \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" \
            -e GITHUB_WORKSPACE \
            -e CARGO_HOME="$GITHUB_WORKSPACE/.ci/cargo" \
            -e RUSTUP_HOME="$GITHUB_WORKSPACE/.ci/rustup" \
            ${{ matrix.container_image }} \
            bash -c '
              set -euo pipefail
              yum install -y git wget rpm cpio make glibc-devel glibc-headers binutils m4 python3 python3-devel libtool libaio ncurses-devel which zlib-devel
              git config --global --add safe.directory "$GITHUB_WORKSPACE"
              cd "$GITHUB_WORKSPACE"
              python3 ./build.py init
              python3 ./build.py build \
                --launcher_cache_dir "$GITHUB_WORKSPACE/.ci/bazel-launcher" \
                --disk_cache="$GITHUB_WORKSPACE/.ci/bazel-cache" \
                --lockfile_mode=error \
                -o build_release //src/observer:libseekdb
              # Binding tests and the pack step read <output_base>/src/include.
              mkdir -p build_release/src/include
              cp -f build_release/bin/src/observer/libseekdb.so build_release/src/include/
            '
      - name: Fix ownership (container writes as root)
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Test Python binding
        id: binding_python
        continue-on-error: true
        run: |
          cd unittest/include/python
          bash test.sh

      - name: Test Node.js FFI binding
        id: binding_node_ffi
        continue-on-error: true
        run: |
          cd unittest/include/nodejs
          npm install
          bash test.sh

      - name: Test Node.js N-API binding
        id: binding_node_napi
        continue-on-error: true
        run: |
          PATH=$(echo "$PATH" | tr ':' '\n' | grep -v 'deps/3rd' | tr '\n' ':' | sed 's/:$//')
          cd unittest/include/nodejs_napi
          npm install
          bash test.sh

      - name: Test Rust binding
        id: binding_rust
        continue-on-error: true
        run: |
          cd unittest/include/rust
          bash test.sh

      - name: Test Go binding
        id: binding_go
        continue-on-error: true
        run: |
          PATH=$(echo "$PATH" | tr ':' '\n' | grep -v 'deps/3rd' | tr '\n' ':' | sed 's/:$//')
          cd unittest/include/go
          bash test.sh

      - name: Test Java binding
        id: binding_java
        continue-on-error: true
        run: |
          PATH=$(echo "$PATH" | tr ':' '\n' | grep -v 'deps/3rd' | tr '\n' ':' | sed 's/:$//')
          cd unittest/include/java
          bash test.sh

      - name: Pack libseekdb
        run: |
          chmod +x package/libseekdb/libseekdb-build.sh
          cd package/libseekdb && bash libseekdb-build.sh "${GITHUB_WORKSPACE}/build_release/src/include"

      - name: Verify packed artifact
        run: |
          chmod +x package/libseekdb/test-packed-artifact-smoke.sh
          package/libseekdb/test-packed-artifact-smoke.sh "package/libseekdb/libseekdb-${{ matrix.platform }}.zip"

      # TEMPORARY: the packed smoke test dies with SIGSEGV on Linux inside
      # seekdb_open. Capture the faulting stack and the engine log so the crash
      # can be diagnosed from CI instead of guessed at. Remove once fixed.
      - name: Debug packed artifact crash
        if: failure()
        continue-on-error: true
        run: |
          if ! command -v gdb >/dev/null 2>&1; then
            sudo apt-get install -y -qq gdb || exit 0
          fi
          # The packed library is stripped, so its frames only print as bare
          # addresses. Symbolize with the unstripped Bazel output of the very
          # same build; both files carry identical code.
          GDB_LIB="$GITHUB_WORKSPACE/build_release/src/include/libseekdb.so"
          if [ ! -f "$GDB_LIB" ]; then
            GDB_LIB="$GITHUB_WORKSPACE/build_release/bin/src/observer/libseekdb.so"
          fi
          echo "== gdb symbol source: $GDB_LIB"

          # The binding tests die the same way right after "observer init
          # begin". The rust test binary is the cheapest reproduction, so catch
          # that fault with symbols before unpacking the release archive.
          if [ -x "$GITHUB_WORKSPACE/unittest/include/rust/target/debug/test" ]; then
            echo "== rust binding test, absolute data dir"
            ( cd "$GITHUB_WORKSPACE/unittest/include/rust" && \
              gdb -batch \
                -ex "handle SIGSEGV stop print nopass" \
                -ex run \
                -ex "bt 40" \
                --args target/debug/test "$PWD/seekdb_gdb.db" test ) || true
          fi

          ZIP="package/libseekdb/libseekdb-${{ matrix.platform }}.zip"
          if [ ! -f "$ZIP" ]; then
            exit 0
          fi
          UNPACK="$(mktemp -d)"
          unzip -q "$ZIP" -d "$UNPACK"
          echo "== libseekdb.so identity"
          sha256sum "$UNPACK/libseekdb.so" build_release/src/include/libseekdb.so || true
          readelf -d "$UNPACK/libseekdb.so" | head -25 || true
          ( cd package/libseekdb/smoke-loader && npx node-gyp rebuild --pack_dir="$UNPACK" ) || exit 0
          [ -f "$GDB_LIB" ] || GDB_LIB="$UNPACK/libseekdb.so"
          cd "$UNPACK"
          gdb -batch \
            -ex "set environment LD_PRELOAD=$GDB_LIB" \
            -ex "set environment SEEKDB_NODE_BINDING_PROBE=1" \
            -ex "handle SIGSEGV stop print nopass" \
            -ex run \
            -ex "thread apply all bt 40" \
            -ex "info registers rip rsp" \
            --args node "$GITHUB_WORKSPACE/package/libseekdb/smoke-loader/smoke-vsag.js" "$UNPACK/gdb-seekdb.db" || true
          if [ -f gdb-seekdb.db/log/seekdb.log ]; then
            echo "== tail of gdb-seekdb.db/log/seekdb.log"
            tail -n 200 gdb-seekdb.db/log/seekdb.log
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: package/libseekdb/libseekdb-*.zip

      - name: Save Cache deps
        if: always()
        uses: actions/cache/save@v4
        with:
          path: deps/3rd
          key: ${{ runner.os }}-libseekdb-deps-${{ matrix.platform }}-el8-${{ hashFiles(format('deps/init/{0}', matrix.deps_file)) }}
      - name: Save Cache Bazel
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .ci/bazel-launcher
            .ci/bazel-cache
          key: ${{ runner.os }}-libseekdb-bazel-${{ matrix.platform }}-${{ hashFiles('MODULE.bazel.lock', 'rust-toolchain.toml') }}
      - name: Save Cache Rust SDK
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .ci/cargo
            .ci/rustup
          key: ${{ runner.os }}-libseekdb-rust-${{ matrix.platform }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}

      - name: Binding tests outcome
        if: always()
        run: |
          failed=0
          for o in \
            "${{ steps.binding_node_ffi.outcome }}" \
            "${{ steps.binding_node_napi.outcome }}" \
            "${{ steps.binding_python.outcome }}" \
            "${{ steps.binding_rust.outcome }}" \
            "${{ steps.binding_go.outcome }}" \
            "${{ steps.binding_java.outcome }}"; do
            [ "$o" = "failure" ] && failed=1
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more libseekdb binding tests failed on ${{ matrix.platform }}"
            exit 1
          fi
          echo "All binding test steps succeeded (or were skipped)."

  # ---------- Build on macOS (no container) ----------
  build-macos:
    name: Build libseekdb (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
            artifact_name: libseekdb-darwin-arm64
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref != '' && inputs.ref || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}

      # The Bazel build takes its libraries from deps/3rd; only the packer's dylib bundler comes from Homebrew.
      - name: Install macOS packaging tools
        run: brew install dylibbundler

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps/3rd
          key: ${{ runner.os }}-libseekdb-deps-${{ matrix.platform }}-${{ hashFiles('deps/init/oceanbase.macos15.arm64.deps') }}
          restore-keys: |
            ${{ runner.os }}-libseekdb-deps-${{ matrix.platform }}-

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: |
            .ci/bazel-launcher
            .ci/bazel-cache
          key: ${{ runner.os }}-libseekdb-bazel-${{ matrix.platform }}-${{ hashFiles('MODULE.bazel.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-libseekdb-bazel-${{ matrix.platform }}-

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Build libseekdb
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          python3 ./build.py init
          python3 ./build.py build \
            --launcher_cache_dir "$GITHUB_WORKSPACE/.ci/bazel-launcher" \
            --disk_cache="$GITHUB_WORKSPACE/.ci/bazel-cache" \
            --lockfile_mode=error \
            -o build_release //src/observer:libseekdb
          # Binding tests and the pack step read <output_base>/src/include.
          mkdir -p build_release/src/include
          cp -f build_release/bin/src/observer/libseekdb.dylib build_release/src/include/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Test Python binding
        id: binding_python
        continue-on-error: true
        run: |
          cd unittest/include/python
          bash test.sh

      - name: Test Node.js FFI binding
        id: binding_node_ffi
        continue-on-error: true
        run: |
          cd unittest/include/nodejs
          npm install
          bash test.sh

      - name: Test Node.js N-API binding
        id: binding_node_napi
        continue-on-error: true
        run: |
          PATH=$(echo "$PATH" | tr ':' '\n' | grep -v 'deps/3rd' | tr '\n' ':' | sed 's/:$//')
          cd unittest/include/nodejs_napi
          npm install
          bash test.sh

      - name: Test Rust binding
        id: binding_rust
        continue-on-error: true
        run: |
          cd unittest/include/rust
          bash test.sh

      - name: Test Go binding
        id: binding_go
        continue-on-error: true
        run: |
          PATH=$(echo "$PATH" | tr ':' '\n' | grep -v 'deps/3rd' | tr '\n' ':' | sed 's/:$//')
          cd unittest/include/go
          bash test.sh

      - name: Test Java binding
        id: binding_java
        continue-on-error: true
        run: |
          PATH=$(echo "$PATH" | tr ':' '\n' | grep -v 'deps/3rd' | tr '\n' ':' | sed 's/:$//')
          cd unittest/include/java
          bash test.sh

      # macOS code signing. Entitlements allow loading embedded dylib.
      - name: Create entitlements (macOS)
        run: |
          echo -e '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0">\n<dict>\n  <key>com.apple.security.cs.disable-library-validation</key>\n  <true/>\n</dict>\n</plist>' > package/libseekdb/entitlements.plist

      # Only import certificate on main repo; script skips when cert empty (ad-hoc signing used).
      - name: Import certificate (macOS)
        if: github.repository == 'oceanbase/seekdb'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.OSX_CODESIGN_BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.OSX_CODESIGN_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.OSX_CODESIGN_KEYCHAIN_PASSWORD }}
        run: . package/libseekdb/osx_import_codesign_certificate.sh

      - name: Pack libseekdb
        env:
          ARCH: ${{ matrix.arch }}
          CODESIGN_IDENTITY: ${{ secrets.OSX_CODESIGN_IDENTITY }}
          CODESIGN_ENTITLEMENTS: ${{ github.workspace }}/package/libseekdb/entitlements.plist
        run: cd package/libseekdb && bash libseekdb-build.sh

      - name: Verify packed artifact
        run: |
          chmod +x package/libseekdb/test-packed-artifact-smoke.sh
          package/libseekdb/test-packed-artifact-smoke.sh package/libseekdb/libseekdb-darwin-arm64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: package/libseekdb/libseekdb-*.zip

      # Save caches even on failure so next run can resume
      - name: Save Cache deps
        if: always()
        uses: actions/cache/save@v4
        with:
          path: deps/3rd
          key: ${{ runner.os }}-libseekdb-deps-${{ matrix.platform }}-${{ hashFiles('deps/init/oceanbase.macos15.arm64.deps') }}
      - name: Save Cache Bazel
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .ci/bazel-launcher
            .ci/bazel-cache
          key: ${{ runner.os }}-libseekdb-bazel-${{ matrix.platform }}-${{ hashFiles('MODULE.bazel.lock', 'rust-toolchain.toml') }}

      - name: Binding tests outcome
        if: always()
        run: |
          failed=0
          for o in \
            "${{ steps.binding_node_ffi.outcome }}" \
            "${{ steps.binding_node_napi.outcome }}" \
            "${{ steps.binding_python.outcome }}" \
            "${{ steps.binding_rust.outcome }}" \
            "${{ steps.binding_go.outcome }}" \
            "${{ steps.binding_java.outcome }}"; do
            [ "$o" = "failure" ] && failed=1
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more libseekdb binding tests failed on ${{ matrix.platform }}"
            exit 1
          fi
          echo "All binding test steps succeeded (or were skipped)."

  # ---------- Android NDK cross-compile (macOS arm64 host; target arm64-v8a) ----------
  # ubuntu-* runners are x86_64 by default. macOS-15 uses Apple silicon + NDK darwin-arm64 prebuilts (see docs).
  # Alternative: runs-on: ubuntu-24.04-arm for Linux ARM64.
  #
  # Why no FFI binding tests here: libseekdb.so is Android arm64-v8a / ELF for Bionic — the dynamic linker,
  # libc, and JNI/NDK ABI differ from macOS dyld. CI cannot dlopen/load that .so on the host like Linux/macOS/Windows jobs.
  # Running the same unittest/include/*/test.sh would require an Android emulator, rooted device, or adb push + adb shell test.
  build-android:
    name: Build libseekdb (android-arm64-v8a)
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref != '' && inputs.ref || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          # Use rYYx form (e.g. r27d); full build numbers (27.3.13750724) 404 on the action download URL
          ndk-version: r27d

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: |
            deps/3rd
            deps/android
          key: ${{ runner.os }}-libseekdb-deps-android-arm64-v8a-${{ hashFiles('deps/init/oceanbase.android.arm64.deps', 'deps/init/oceanbase.macos15.arm64.deps') }}
          restore-keys: |
            ${{ runner.os }}-libseekdb-deps-android-arm64-v8a-

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: |
            .ci/bazel-launcher
            .ci/bazel-cache
          key: ${{ runner.os }}-libseekdb-bazel-android-arm64-v8a-${{ hashFiles('MODULE.bazel.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-libseekdb-bazel-android-arm64-v8a-

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Build libseekdb
        run: |
          set -euo pipefail
          # ANDROID_NDK_HOME is set by the NDK install step; the Bazel toolchain
          # repository reads it and pins ABI arm64-v8a / API 28.
          python3 ./build.py init --android
          python3 ./build.py build \
            --config=android \
            --launcher_cache_dir "$GITHUB_WORKSPACE/.ci/bazel-launcher" \
            --disk_cache="$GITHUB_WORKSPACE/.ci/bazel-cache" \
            --lockfile_mode=error \
            -o build_android_release //src/observer:libseekdb
          # The pack script reads <output_base>/src/include.
          mkdir -p build_android_release/src/include
          cp -f build_android_release/bin/src/observer/libseekdb.so build_android_release/src/include/

      # Same toolchain install order as other jobs (no host FFI below).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Test bindings (host skip)
        id: android_binding_notice
        run: |
          echo "::notice::Skipping native FFI binding tests on this runner: libseekdb.so targets Android arm64-v8a / Bionic and cannot be dlopen()'d on the macOS host."
          echo "Zip verification runs after pack; device or emulator CI would be required for full FFI tests."

      - name: Pack libseekdb
        run: cd package/libseekdb && bash libseekdb-build.sh --android

      - name: Verify packed artifact
        id: android_verify_zip
        continue-on-error: true
        run: unzip -t package/libseekdb/libseekdb-android-arm64-v8a.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libseekdb-android-arm64-v8a
          path: package/libseekdb/libseekdb-android-arm64-v8a.zip

      - name: Save Cache deps
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            deps/3rd
            deps/android
          key: ${{ runner.os }}-libseekdb-deps-android-arm64-v8a-${{ hashFiles('deps/init/oceanbase.android.arm64.deps', 'deps/init/oceanbase.macos15.arm64.deps') }}

      - name: Save Cache Bazel
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .ci/bazel-launcher
            .ci/bazel-cache
          key: ${{ runner.os }}-libseekdb-bazel-android-arm64-v8a-${{ hashFiles('MODULE.bazel.lock', 'rust-toolchain.toml') }}

      - name: Pack / zip verification outcome
        if: always()
        run: |
          if [ "${{ steps.android_verify_zip.outcome }}" = "failure" ]; then
            echo "::error::Packaged zip verification failed (unzip -t)"
            exit 1
          fi
          echo "Android pack and zip verification OK (or verify step skipped)."

  # ---------- Build on Windows x64 (native, embed DLL) ----------
  build-windows:
    name: Build libseekdb (windows-x64)
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref != '' && inputs.ref || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: deps/3rd
          key: ${{ runner.os }}-libseekdb-deps-windows-x64-${{ hashFiles('deps/init/oceanbase.windows.x86_64.deps') }}
          restore-keys: |
            ${{ runner.os }}-libseekdb-deps-windows-x64-

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: |
            .ci/bazel-launcher
            .ci/bazel-cache
          key: ${{ runner.os }}-libseekdb-bazel-windows-x64-${{ hashFiles('MODULE.bazel.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-libseekdb-bazel-windows-x64-

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      # The Bazel Windows SDK repository rule bundles the MSVC runtime DLLs from
      # VCToolsRedistDir, and the seekdb-jemalloc-sys Cargo build script shells
      # out to a GNU make. Both are prepared here so the build step can run from
      # a plain PowerShell shell instead of a Developer Command Prompt.
      - name: Prepare MSVC and MinGW toolchain
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found: $vswhere" }
          $vsPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw "No Visual Studio installation with the MSVC C++ toolset was found." }
          $msvcRedistRoot = Join-Path $vsPath "VC\Redist\MSVC"
          if (-not (Test-Path $msvcRedistRoot)) { throw "MSVC redistributables root not found: $msvcRedistRoot" }
          $redistVersion = (Get-ChildItem -Path $msvcRedistRoot -Directory |
            Where-Object { Test-Path (Join-Path $_.FullName "x64") } |
            Sort-Object Name -Descending | Select-Object -First 1).Name
          if (-not $redistVersion) { throw "No MSVC redistributable version with an x64 directory under $msvcRedistRoot" }
          $redist = Join-Path $msvcRedistRoot $redistVersion
          "VCToolsRedistDir=$redist" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "VCToolsRedistDir=$redist"

          choco install mingw -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "choco install mingw failed with exit code $LASTEXITCODE" }
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" +
            [System.Environment]::GetEnvironmentVariable("Path","User")
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            $mingwMake = Get-Command mingw32-make -ErrorAction SilentlyContinue
            if (-not $mingwMake) { throw "Neither make nor mingw32-make is available after installing MinGW." }
            $shimDir = Join-Path $env:RUNNER_TEMP "gnu-make-shim"
            New-Item -ItemType Directory -Force -Path $shimDir | Out-Null
            Copy-Item -Path $mingwMake.Source -Destination (Join-Path $shimDir "make.exe") -Force
            Add-Content -Path $env:GITHUB_PATH -Value $shimDir -Encoding utf8
          }
          Get-Command make -ErrorAction SilentlyContinue | Out-Host

      - name: Build libseekdb
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" +
            [System.Environment]::GetEnvironmentVariable("Path","User") + ";" + $env:Path
          $ws = if ($env:GITHUB_WORKSPACE) { $env:GITHUB_WORKSPACE } else { (Get-Location).Path }
          python ./build.py init
          if ($LASTEXITCODE -ne 0) { throw "build.py init failed with exit code $LASTEXITCODE" }
          # lld-link emits megabytes of duplicate-symbol warnings for this link
          # (/FORCE:MULTIPLE), which overruns the default 1 MiB stderr cap and
          # hides the actual fatal diagnostic. Keep the whole output.
          python ./build.py build `
            --launcher_cache_dir "$ws/.ci/bazel-launcher" `
            --disk_cache="$ws/.ci/bazel-cache" `
            --lockfile_mode=error `
            --experimental_ui_max_stdouterr_bytes=16777216 `
            -o build_release //src/observer:libseekdb
          if ($LASTEXITCODE -ne 0) { throw "build.py build failed with exit code $LASTEXITCODE" }
          # Binding tests read <output_base>/src/include, the same layout the
          # other platforms stage. The import library is what MSVC and MinGW
          # consumers link against; the .dll.a copy gives MinGW's -lseekdb the
          # name it searches for.
          $include = Join-Path $ws "build_release/src/include"
          New-Item -ItemType Directory -Force -Path $include | Out-Null
          Copy-Item "build_release/bin/src/observer/seekdb.dll" $include -Force
          Copy-Item "build_release/bin/src/observer/seekdb.lib" $include -Force
          Copy-Item "build_release/bin/src/observer/seekdb.lib" (Join-Path $include "libseekdb.dll.a") -Force

      - name: Debug facts (Windows)
        shell: pwsh
        env:
          BUILD_TYPE: release
        run: |
          $ErrorActionPreference = "Continue"
          . ./unittest/include/seekdb-windows-dll-resolve.ps1
          . ./unittest/include/debug-libseekdb-windows.ps1
          Write-LibseekdbWindowsBuildFacts -RepoRoot "$PWD"

      - name: Verify libseekdb DLL (Windows)
        shell: pwsh
        env:
          BUILD_TYPE: release
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          . ./unittest/include/seekdb-windows-dll-resolve.ps1
          $bdn = Get-SeekDbWindowsBuildDirNameFromEnv
          $r = Find-SeekDbWindowsDll -RepoRoot "$PWD" -BuildDirName $bdn
          if (-not $r) {
            Write-SeekDbWindowsDllDiagnostics -RepoRoot "$PWD" -BuildDirName $bdn
            throw "libseekdb build did not produce seekdb.dll under build_$bdn (see diagnostics above)."
          }
          Write-Host "libseekdb DLL: $($r.DllPath)"
          "SEEKDB_LIB_PATH=$($r.DllPath)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Maven (Java)
        shell: pwsh
        run: choco install maven -y --no-progress

      # One job step per language: if something hangs, the in-progress step name in the Actions UI shows
      # whether the stall is in Python, npm, node-gyp, cargo, go, or Java (not “whole binding” vs global timeout).
      - name: Test Python binding
        id: binding_python
        continue-on-error: true
        shell: pwsh
        env:
          SEEKDB_BINDING_SECTION: Python
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          Get-Command gcc | Out-Host
          Get-Command mvn | Out-Host
          .\unittest\include\run-libseekdb-binding-tests.ps1 -RepoRoot "$PWD" -ContinueOnError

      - name: Test Node.js FFI binding
        id: binding_node_ffi
        continue-on-error: true
        shell: pwsh
        env:
          SEEKDB_BINDING_SECTION: NodeFfi
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          .\unittest\include\run-libseekdb-binding-tests.ps1 -RepoRoot "$PWD" -ContinueOnError

      - name: Test Node.js N-API binding
        id: binding_node_napi
        continue-on-error: true
        shell: pwsh
        env:
          SEEKDB_BINDING_SECTION: NodeNapi
          # VECTOR + DBMS_HYBRID_SEARCH cases can stall native code on Windows runners; core N-API still covered.
          SEEKDB_NODE_NAPI_SKIP_HEAVY: "1"
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          .\unittest\include\run-libseekdb-binding-tests.ps1 -RepoRoot "$PWD" -ContinueOnError

      - name: Test Rust binding
        id: binding_rust
        continue-on-error: true
        shell: pwsh
        env:
          SEEKDB_BINDING_SECTION: Rust
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          .\unittest\include\run-libseekdb-binding-tests.ps1 -RepoRoot "$PWD" -ContinueOnError

      - name: Test Go binding
        id: binding_go
        continue-on-error: true
        shell: pwsh
        env:
          SEEKDB_BINDING_SECTION: Go
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          .\unittest\include\run-libseekdb-binding-tests.ps1 -RepoRoot "$PWD" -ContinueOnError

      - name: Test Java binding
        id: binding_java
        continue-on-error: true
        shell: pwsh
        env:
          SEEKDB_BINDING_SECTION: Java
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
          .\unittest\include\run-libseekdb-binding-tests.ps1 -RepoRoot "$PWD" -ContinueOnError

      - name: Pack libseekdb
        shell: pwsh
        env:
          BUILD_TYPE: release
        run: .\package\libseekdb\libseekdb-build.ps1

      # Hard gate: mirrors linux/macos (Verify packed artifact); fails the job if the packed zip does not load.
      # Same step name as linux/macos (Verify packed artifact); platform script differs (see package/libseekdb/test-packed-artifact-smoke.ps1).
      - name: Verify packed artifact
        shell: pwsh
        run: .\package\libseekdb\test-packed-artifact-smoke.ps1 -Zip "package\libseekdb\libseekdb-windows-x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libseekdb-windows-x64
          path: package/libseekdb/libseekdb-windows-x64.zip

      - name: Save Cache deps
        if: always()
        uses: actions/cache/save@v4
        with:
          path: deps/3rd
          key: ${{ runner.os }}-libseekdb-deps-windows-x64-${{ hashFiles('deps/init/oceanbase.windows.x86_64.deps') }}

      - name: Save Cache Bazel
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .ci/bazel-launcher
            .ci/bazel-cache
          key: ${{ runner.os }}-libseekdb-bazel-windows-x64-${{ hashFiles('MODULE.bazel.lock', 'rust-toolchain.toml') }}

      - name: Binding tests outcome
        if: always()
        shell: pwsh
        run: |
          $failed = $false
          if ("${{ steps.binding_python.outcome }}" -eq "failure") { Write-Host "::error::Binding section failed: Python"; $failed = $true }
          if ("${{ steps.binding_node_ffi.outcome }}" -eq "failure") { Write-Host "::error::Binding section failed: Node FFI (koffi)"; $failed = $true }
          if ("${{ steps.binding_node_napi.outcome }}" -eq "failure") { Write-Host "::error::Binding section failed: Node N-API"; $failed = $true }
          if ("${{ steps.binding_rust.outcome }}" -eq "failure") { Write-Host "::error::Binding section failed: Rust"; $failed = $true }
          if ("${{ steps.binding_go.outcome }}" -eq "failure") { Write-Host "::error::Binding section failed: Go"; $failed = $true }
          if ("${{ steps.binding_java.outcome }}" -eq "failure") { Write-Host "::error::Binding section failed: Java"; $failed = $true }
          if ($failed) { exit 1 }
          Write-Host "All Windows binding test sections succeeded."

  # ---------- Collect libseekdb artifacts and upload to S3 (runs only when all needed build jobs succeed, including binding tests) ----------
  release-artifacts:
    name: Collect artifacts and upload to S3
    runs-on: ubuntu-22.04
    needs:
      - build
      - build-macos
      - build-android
      - build-windows
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List all artifacts
        run: |
          echo "=== All artifacts ==="
          ls -la release-artifacts/

      - name: Upload combined artifact (for workflow download)
        uses: actions/upload-artifact@v4
        with:
          name: libseekdb-all-platforms
          path: release-artifacts/

      - name: Configure AWS credentials
        if: env.UPLOAD_S3 == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        if: env.UPLOAD_S3 == 'true'
        run: |
          set -e
          if [ -n "${{ env.DESTINATION_TARGET_PATH }}" ]; then
            S3_TARGET="${{ env.DESTINATION_TARGET_PATH }}"
          else
            S3_TARGET="s3://${{ env.S3_BUCKET }}/${{ env.S3_PREFIX }}/"
          fi
          [ "${S3_TARGET: -1}" != "/" ] && S3_TARGET="${S3_TARGET}/"
          echo "Uploading to $S3_TARGET"
          aws s3 cp release-artifacts/ "$S3_TARGET" --recursive --exclude "*" --include "*.zip" --no-progress
          echo "Uploaded:"
          aws s3 ls "$S3_TARGET" --recursive
          echo "Done."
        continue-on-error: true
