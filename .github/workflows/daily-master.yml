# Daily full SeekDB CI on the master branch (compile + mysqltest).
name: Daily Master Build

on:
  schedule:
    # 08:00 UTC+8 (00:00 UTC) daily; scheduled workflows always run against the default branch (master).
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: daily-master-build
  cancel-in-progress: true

jobs:
  seekdb-ci:
    if: github.repository == 'oceanbase/seekdb'
    uses: ./.github/workflows/seekdb.yml
    secrets: inherit
