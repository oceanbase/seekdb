# SeekDB CI - 执行下沉版（Native）
# setup 准备 observer → 4 个并行 mysqltest job（各独立容器）→ collect 合并结果
name: SeekDB CI 

on:
  pull_request:
    branches: [master, develop]
    types: [opened, reopened, synchronize, ready_for_review]
    paths-ignore:
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - 'README.md'
      - 'README_CN.md'
      - 'CONTRIBUTING.md'
  schedule:
    - cron: '30 9 * * *'
  workflow_dispatch:

env:
  MYSQLTEST_SLICES: "4"
  SEEKDB_TASK_DIR: ${{ github.workspace }}/seekdb_build/${{ github.run_id }}
  cache-name: cache-deps

jobs:
  seekdb-setup:
    if: ${{ github.repository_owner == 'guoyan1996' && !github.event.pull_request.draft }}
    name: setup
    runs-on: seekdb-test-arc-runner-k8s
    container:
      image: harbor.oceanbase-dev.com/obrde-test/seekdb-actions-runner:test-20260310
    steps:
      - name: Checkout
        uses: actions/checkout@v4


      - name: Cache deps
        uses: actions/cache@v4
        if: false
        with:
          key: ${{ runner.os }}-build-${{ env.cache-name }}-el9.x86_64-${{ hashFiles('deps/init/oceanbase.el9.x86_64.deps') }}
          path: deps/3rd

      - name: Prepare (jobargs, run_jobs)
        shell: bash
        run: |
          chmod +x .github/script/seekdb/prepare.sh
          export GITHUB_RUN_ID="${{ github.run_id }}"
          export GITHUB_WORKSPACE="${{ github.workspace }}"
          export MYSQLTEST_SLICES="${{ env.MYSQLTEST_SLICES }}"
          export SEEKDB_TASK_DIR="${{ env.SEEKDB_TASK_DIR }}"
          .github/script/seekdb/prepare.sh

      - name: Setup ccache
        if: false
        uses: hendrikmuhs/ccache-action@v1.2.11
        with:
          max-size: 800M
          save: ${{ github.event_name == 'push' }}
          key: seekdb

      # 暂时用下载获取 observer；恢复编译时去掉本步的 if: false，并给下方 Compile 去掉 if: false、用编译产物作为 observer
      - name: Download mysqltest artifacts
        shell: bash
        if: false
        run: |
          URL="${{ vars.SEEKDB_OBSERVER_URL }}"
          if [[ -z "$URL" ]]; then
            echo "vars.SEEKDB_OBSERVER_URL not set, using default"
            URL="http://6.12.233.4:5000/observer"
          fi
          echo "Downloading observer from $URL (cwd: $(pwd))"
          if ! wget -O observer "$URL"; then
            echo "wget failed (check URL, network, or set vars.SEEKDB_OBSERVER_URL)"
            exit 1
          fi
          chmod +x observer
          ls -la observer

      - name: Compile
        id: compile
        shell: bash
        run: |
          chmod +x .github/script/seekdb/compile.sh
          export GITHUB_RUN_ID="${{ github.run_id }}"
          WS="${{ github.workspace }}"
          if [[ ! -f "$WS/build.sh" ]] && [[ -f "$(pwd)/build.sh" ]]; then
            export GITHUB_WORKSPACE="$(pwd)"
          else
            export GITHUB_WORKSPACE="$WS"
          fi
          export SEEKDB_TASK_DIR="${{ env.SEEKDB_TASK_DIR }}"
          export RELEASE_MODE="${{ vars.RELEASE_MODE || '' }}"
          export FORWARDING_HOST="${{ vars.FORWARDING_HOST || '' }}"
          export PATH="$GITHUB_WORKSPACE/deps/3rd/usr/local/oceanbase/devtools/bin:$PATH"
          .github/script/seekdb/compile.sh

      - name: Record compile failure
        if: false && steps.compile.outcome == 'failure'
        shell: bash
        run: echo '++compile++' >> "${{ env.SEEKDB_TASK_DIR }}/fail_cases.output"

      - name: Show parser error (if any)
        if: false
        shell: bash
        run: |
          WS="${{ github.workspace }}"
          ERR="$WS/src/sql/parser/_gen_parser.error"
          OUT="$WS/src/sql/parser/_gen_parser.output"
          echo "workspace=$WS"
          ls -la "$WS/src/sql/parser/" 2>/dev/null || true
          if [[ -f "$ERR" ]]; then cat "$ERR"; else echo "(file not found)"; fi
          if [[ -f "$OUT" ]]; then tail -80 "$OUT"; else echo "(file not found)"; fi

      - name: Prepare observer
        shell: bash
        run: |
          if [[ ! -x observer ]]; then
            for base in build_debug build_release build; do
              for cand in "$base/observer" "$base/src/observer/observer"; do
                if [[ -f "$cand" ]] && [[ -x "$cand" ]]; then
                  cp -f "$cand" observer && chmod +x observer
                  echo "observer copied from $cand"
                  break 2
                fi
              done
            done
          fi
          if [[ ! -x observer ]]; then echo "observer missing or not executable"; exit 1; fi
          echo "observer size: $(stat -c%s observer 2>/dev/null || stat -f%z observer 2>/dev/null) bytes"

      - name: Compress and upload observer
        shell: bash
        run: |
          zstd -f -q -T0 -o observer.zst observer
          echo "observer.zst size: $(stat -c%s observer.zst 2>/dev/null || stat -f%z observer.zst 2>/dev/null) bytes"

      - name: Upload observer artifact (zst)
        uses: actions/upload-artifact@v4
        with:
          name: seekdb-observer
          path: observer.zst
          retention-days: 1

  seekdb-mysqltest:
    if: ${{ github.repository_owner == 'guoyan1996' && !github.event.pull_request.draft }}
    name: mysqltest-slice-${{ matrix.slice }}
    needs: seekdb-setup
    runs-on: seekdb-test-arc-runner-k8s
    strategy:
      fail-fast: false
      matrix:
        slice: [0, 1, 2, 3]
    container:
      image: harbor.oceanbase-dev.com/obrde-test/seekdb-actions-runner:test-20260310
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download observer from artifact
        id: get-observer
        uses: actions/download-artifact@v4
        with:
          name: seekdb-observer
        continue-on-error: true

      - name: Place observer (decompress or fallback wget)
        shell: bash
        run: |
          if [[ -f seekdb-observer ]]; then
            zstd -d -f -q -o observer seekdb-observer && chmod +x observer
          elif [[ -f seekdb-observer/observer.zst ]]; then
            zstd -d -f -q -o observer seekdb-observer/observer.zst && chmod +x observer
          elif [[ -f seekdb-observer/observer ]]; then
            mv seekdb-observer/observer observer && chmod +x observer
          else
            echo "Artifact not found, falling back to wget"
            URL="${{ vars.SEEKDB_OBSERVER_URL }}"
            [[ -z "$URL" ]] && URL="http://6.12.233.4:5000/observer"
            wget -O observer "$URL" || exit 1
            chmod +x observer
          fi
          ls -la observer

      - name: Run mysqltest slice
        shell: bash
        run: |
          chmod +x .github/script/seekdb/mysqltest_slice.sh
          export GITHUB_RUN_ID="${{ github.run_id }}" GITHUB_WORKSPACE="${{ github.workspace }}"
          export SEEKDB_TASK_DIR="${{ github.workspace }}/seekdb_build/${{ github.run_id }}/slice_${{ matrix.slice }}"
          export SLICE_IDX=${{ matrix.slice }} SLICES="${{ env.MYSQLTEST_SLICES }}"
          export BRANCH="${{ github.ref_name }}" FORWARDING_HOST="${{ vars.FORWARDING_HOST || '' }}"
          mkdir -p "$SEEKDB_TASK_DIR"
          .github/script/seekdb/mysqltest_slice.sh

      - name: Collect slice result
        if: success() || failure()
        shell: bash
        run: |
          chmod +x .github/script/seekdb/collect_result.sh
          export GITHUB_RUN_ID="${{ github.run_id }}" GITHUB_WORKSPACE="${{ github.workspace }}"
          export SEEKDB_TASK_DIR="${{ github.workspace }}/seekdb_build/${{ github.run_id }}/slice_${{ matrix.slice }}"
          .github/script/seekdb/collect_result.sh seekdb_result.json
        continue-on-error: true

      - name: Upload slice result
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: seekdb-result-slice-${{ matrix.slice }}
          path: seekdb_result.json
          retention-days: 1
        continue-on-error: true

      # 失败时上传 collected_log 便于排查：obd_log、mysqltest_log、mysqltest_rec_log、core
      - name: Upload collected_log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: seekdb-collected-log-slice-${{ matrix.slice }}
          path: seekdb_home_${{ matrix.slice }}/collected_log_${{ matrix.slice }}.tar.gz
          retention-days: 7
        continue-on-error: true

      - name: Job summary (logs hint)
        if: always()
        run: |
          if [[ -f "seekdb_home_${{ matrix.slice }}/collected_log_${{ matrix.slice }}.tar.gz" ]]; then
            echo "### Slice ${{ matrix.slice }} collected_log uploaded" >> "$GITHUB_STEP_SUMMARY"
            echo "Download **seekdb-collected-log-slice-${{ matrix.slice }}** from Artifacts. Contents: \`obd_log/\`, \`mysqltest_log/\`, \`mysqltest_rec_log/\`, core dumps." >> "$GITHUB_STEP_SUMMARY"
          fi

  seekdb-collect:
    # 仅在 4 个 mysqltest slice 都跑完（成功或失败）时执行；若 mysqltest 被 skip 则不跑
    if: ${{ github.repository_owner == 'guoyan1996' && !github.event.pull_request.draft && (always() && (needs.seekdb-mysqltest.result == 'success' || needs.seekdb-mysqltest.result == 'failure')) }}
    name: collect
    needs: seekdb-mysqltest
    runs-on: seekdb-test-arc-runner-k8s
    container:
      image: harbor.oceanbase-dev.com/obrde-test/seekdb-actions-runner:test-20260310
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all slice results
        uses: actions/download-artifact@v4
        with:
          pattern: seekdb-result-slice-*
          path: slice_results
          merge-multiple: true

      - name: Merge results and upload
        shell: bash
        run: |
          RUN_ID="${{ github.run_id }}"
          FAILED=""
          SUCCESS="true"
          while IFS= read -r f; do
            [[ -f "$f" ]] || continue
            grep -q '"success":false' "$f" 2>/dev/null && SUCCESS="false"
            while IFS= read -r c; do
              [[ -n "$c" ]] && FAILED="${FAILED}${FAILED:+,}\"${c//\"/\\\"}\""
            done < <(grep -oP '"failed_cases":\[\K[^\]]*' "$f" 2>/dev/null | tr ',' '\n' | sed 's/^"\|"$//g')
          done < <(find slice_results -name 'seekdb_result.json' 2>/dev/null)
          echo "{\"success\":$SUCCESS,\"run_id\":\"$RUN_ID\",\"failed_cases\":[${FAILED:-}]}" > seekdb_result.json
          echo "=== SeekDB native result ==="
          cat seekdb_result.json

      - name: Upload SeekDB result as artifact
        uses: actions/upload-artifact@v4
        with:
          name: seekdb-result-native
          path: seekdb_result.json
          retention-days: 30

      - name: Job summary (where to find logs)
        run: |
          echo "## SeekDB CI 结果与日志" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| 内容 | Artifact 名称 | 说明 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|---------------|------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 汇总结果 | \`seekdb-result-native\` | 各 slice 合并后的 success/failed_cases |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 单 slice 结果 | \`seekdb-result-slice-0\` ~ \`3\` | 各 slice 的 seekdb_result.json |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 失败时详细日志 | \`seekdb-collected-log-slice-N\` | obd_log、mysqltest_log、mysqltest_rec_log、core，仅失败时上传 |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "在本次 Run 的 **Artifacts** 区域下载上述文件。" >> "$GITHUB_STEP_SUMMARY"
