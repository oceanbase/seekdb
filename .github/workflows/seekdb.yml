name: Repackage seekdb RPM
run-name: Repackage RPM from binary run 43170742983

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  rpm:
    name: rpm-linux-x86_64-glibc2.17
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download the previously built binary and obshell
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: binary-linux-x86_64-glibc2.17
          run-id: 43170742983
          github-token: ${{ github.token }}
          path: input
      - name: Install RPM packaging tools
        run: sudo apt-get update -qq && sudo apt-get install -y rpm binutils debugedit elfutils file
      - name: Verify the existing binary and build RPMs
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import tempfile

          sys.path.insert(0, str(Path('package').resolve()))
          import binary

          archives = list(Path('input').glob('seekdb-binary-*.tar.gz'))
          if len(archives) != 1:
              raise ValueError('expected one binary archive from the previous run')
          output = Path('dist')
          output.mkdir()
          with tempfile.TemporaryDirectory(prefix='rpm-repack-') as temporary:
              work = Path(temporary)
              bundle, manifest = binary.load(archives[0].resolve(), work / 'binary', '1.4.0.0')
              if manifest['source_commit'] != '22f678b6e11ab278a19078ef0dc89d4450cc711f':
                  raise ValueError('unexpected binary source commit')
              target = manifest['platform']
              if (target['os'], target['arch'], target['glibc']) != ('linux', 'x86_64', '2.17'):
                  raise ValueError('unexpected binary platform')
              subprocess.run(['tar', '-xzf', 'input/obshell.tar.gz', '-C', str(work), '--', 'obshell'], check=True)
              subprocess.run([sys.executable, 'package/package.py', 'rpm', '--version', '1.4.0.0',
                              '--release', '1', '--binary-package', str(bundle),
                              '--obshell-bin', str(work / 'obshell'), '--output', str(output.resolve())], check=True)
          packages = sorted(output.glob('*.rpm'))
          if len(packages) != 2 or any(path.name.startswith('seekdb-libs-') for path in packages):
              raise ValueError('expected only seekdb and seekdb-debuginfo RPMs')
          main = next(output.glob('seekdb-1.4.0.0-1*.rpm'))
          requires = subprocess.check_output(['rpm', '-qp', '--requires', str(main)], text=True)
          files = subprocess.check_output(['rpm', '-qpl', str(main)], text=True)
          if not {'libaio', 'systemd'} <= set(requires.splitlines()) or 'seekdb-libs' in requires:
              raise ValueError('RPM dependencies do not match the released package')
          if 'libaio.so' in files:
              raise ValueError('RPM must use the system libaio')
          payload = subprocess.check_output(['rpm', '-qp', '--qf', '%{PAYLOADCOMPRESSOR}/%{PAYLOADFLAGS}', str(main)], text=True)
          if payload != 'xz/2':
              raise ValueError('expected the released RPM compression format')
          (output / 'requires.txt').write_text(requires)
          (output / 'packaging-info.json').write_text(json.dumps({
              'source_run_id': 43170742983,
              'source_artifact_id': 13924890537,
              'binary_source_commit': manifest['source_commit'],
              'binary_built_at': manifest['built_at'],
              'binary_sha256': manifest['files']['bin/seekdb']['sha256'],
              'packaging_commit': os.environ['GITHUB_SHA'],
              'platform': target,
          }, indent=2) + '\n')
          for path in packages:
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              path.with_name(path.name + '.sha256').write_text(digest + '  ' + path.name + '\n')
              print(path.name, path.stat().st_size, digest)
          print(requires)
          PY
      - name: Upload repackaged RPMs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rpm-linux-x86_64-glibc2.17-repack
          path: dist/*
          if-no-files-found: error
          compression-level: 0
