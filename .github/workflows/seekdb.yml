name: SeekDB CI

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [master, develop]
    types: [opened, reopened, synchronize, ready_for_review]
  schedule:
    - cron: '30 9 * * *'

permissions:
  contents: read

env:
  SEEKDB_BINARY_PATH: build/bin/src/observer/seekdb
  SEEKDB_CACHE_NFS_ROOT: /data/storage/jenkins_on_k8s/results/seekdb/_cache

jobs:
  # 路径过滤下沉到 job 级：Markdown-only PR 也会创建 skipped check run，
  # 避免 branch protection 的 required check 永远 pending。
  changes:
    name: changes
    if: ${{ github.repository_owner == 'oceanbase' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ci: ${{ steps.decide.outputs.ci }}
    steps:
      - name: Decide whether to run code CI
        id: decide
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== 'pull_request') {
              core.setOutput('ci', 'true');
              return;
            }
            const ignored = (path) =>
              path.endsWith('.md') ||
              path.startsWith('docs/') ||
              path.startsWith('.github/ISSUE_TEMPLATE/');
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            // PR files API 最多返回 3000 个文件；超出时保守执行完整 CI。
            const runCi = files.length >= 3000 || files.some((f) => !ignored(f.filename));
            core.info(`Changed files: ${files.length}; run code CI: ${runCi}`);
            core.setOutput('ci', String(runCi));
  seekdb-setup:
    name: build-and-test
    needs: changes
    if: ${{ github.repository_owner == 'oceanbase' && needs.changes.outputs.ci == 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: arc-runner-k8s-ci-org-25c100g
    container:
      image: harbor.oceanbase-dev.com/obrde-test/ob-actions-runner-worker:0.0.2
    steps:
      - name: Checkout source
        shell: bash
        run: |
          set -euo pipefail
          KEY_FILE="/obshared/seekdb/id_rsa"
          KNOWN_HOSTS="/obshared/seekdb/known_hosts"
          if [[ ! -r "$KEY_FILE" ]]; then
            echo "GitHub checkout private key is unavailable: $KEY_FILE" >&2
            exit 1
          fi
          if [[ ! -r "$KNOWN_HOSTS" ]]; then
            echo "GitHub known_hosts file is unavailable: $KNOWN_HOSTS" >&2
            exit 1
          fi
          export GIT_SSH_COMMAND="/usr/bin/ssh -i $KEY_FILE -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=$KNOWN_HOSTS"
          REMOTE_URL="ssh://git@ssh.github.com:443/${GITHUB_REPOSITORY}.git"
          echo "Using runner-mounted SSH key for GitHub checkout"

          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote remove origin 2>/dev/null || true
          git -C "$GITHUB_WORKSPACE" remote add origin "$REMOTE_URL"
          for attempt in 1 2 3; do
            if git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$GITHUB_SHA"; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "checkout fetch failed after $attempt attempts" >&2
              exit 1
            fi
            delay=$((attempt * 5))
            echo "checkout fetch attempt $attempt failed; retrying in ${delay}s" >&2
            sleep "$delay"
          done
          git -C "$GITHUB_WORKSPACE" checkout --force --detach FETCH_HEAD
          git -C "$GITHUB_WORKSPACE" clean -ffdx

      - name: Configure cache paths
        shell: bash
        run: |
          set -euo pipefail
          RUST_CONFIG=$(sha256sum rust-toolchain.toml | cut -d ' ' -f 1)
          CACHE_ROOT="$SEEKDB_CACHE_NFS_ROOT/shared"

          prepare_cache() {
            local root="$1" dir probe
            for dir in "$root/deps" "$root/bazel" "$root/cargo" "$root/rustup/$RUST_CONFIG"; do
              mkdir -p "$dir" || return 1
              probe=$(mktemp "$dir/.seekdb-write.XXXXXX") || return 1
              rm -- "$probe" || return 1
            done
          }

          # An unmounted NFS path can resolve to the container filesystem.
          # Look at the nearest existing ancestor before creating anything.
          mount_path="$CACHE_ROOT"
          while [[ ! -d "$mount_path" && "$mount_path" != / ]]; do
            mount_path=$(dirname -- "$mount_path")
          done
          fs_type=$(findmnt --noheadings --output FSTYPE --target "$mount_path") || fs_type=unknown
          if [[ "$fs_type" == nfs || "$fs_type" == nfs4 ]] && prepare_cache "$CACHE_ROOT"; then
            echo "Using shared NFS cache: $CACHE_ROOT"
          else
            echo "::warning::Shared NFS cache is unavailable or not writable; using runner-local cache for this job."
            CACHE_ROOT=$(mktemp -d "${RUNNER_TEMP:?}/seekdb-cache.XXXXXX")
            prepare_cache "$CACHE_ROOT"
            echo "Using runner-local cache: $CACHE_ROOT"
          fi
          {
            echo "DEP_CACHE_DIR=$CACHE_ROOT/deps"
            echo "BAZEL_DISK_CACHE=$CACHE_ROOT/bazel"
            echo "CARGO_HOME=$CACHE_ROOT/cargo"
            echo "RUSTUP_HOME=$CACHE_ROOT/rustup/$RUST_CONFIG"
          } >> "$GITHUB_ENV"
          echo "$CACHE_ROOT/cargo/bin" >> "$GITHUB_PATH"

      - name: Compile
        id: compile
        shell: bash
        run: |
          chmod +x .github/script/seekdb/compile.sh
          export GITHUB_RUN_ID="${{ github.run_id }}"
          export SEEKDB_TASK_DIR="$GITHUB_WORKSPACE/seekdb_build/${{ github.run_id }}"
          export FORWARDING_HOST="${{ vars.FORWARDING_HOST || '' }}"
          .github/script/seekdb/compile.sh

      - name: Test
        id: test
        shell: bash
        run: |
          set -euo pipefail
          RUN_DIR=$(mktemp -d "${RUNNER_TEMP:?}/sqltest.XXXXXX")
          DEST_DIR=$(mktemp -d "${RUNNER_TEMP:?}/seekdb-test-logs.XXXXXX")
          echo "log_dir=$DEST_DIR" >> "$GITHUB_OUTPUT"
          TEST_ROOT="$GITHUB_WORKSPACE/tests/mysqltest"
          RESULT=0
          "$GITHUB_WORKSPACE/tools/sqltest/bin/linux-amd64/sqltest" --seekdb "$GITHUB_WORKSPACE/$SEEKDB_BINARY_PATH" \
            --test-root "$TEST_ROOT" --run-dir "$RUN_DIR" -j 24 --case-timeout 1h \
            2>&1 | tee "$DEST_DIR/sqltest.log" || RESULT=$?
          echo "SQL regression output: seekdb-sqltest-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT artifact." >> "$GITHUB_STEP_SUMMARY"
          if [[ -d "$TEST_ROOT/rejects" ]]; then
            (cd "$TEST_ROOT" && find rejects -type f -exec cp --parents -t "$DEST_DIR" -- {} +)
          fi
          if [[ "$RESULT" -ne 0 ]]; then
            (cd "$RUN_DIR" && find . -type f -name console.log -exec cp --parents -t "$DEST_DIR" -- {} +)
          fi
          exit "$RESULT"

      - name: Upload seekdb test logs
        if: ${{ !cancelled() && steps.test.outputs.log_dir != '' }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: seekdb-sqltest-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.test.outputs.log_dir }}
          if-no-files-found: error
