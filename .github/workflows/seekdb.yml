name: Validate packaging symbol review fixes

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-symbols:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: Initialize actual Windows dependency SDK
        run: python build.py init
      - name: Validate PE and PDB export on Windows
        run: python .github/scripts/review-symbols/check_windows.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: symbols-review-results
          path: dist/symbols-review-results.json
          if-no-files-found: error
