# Keep canonical URLs and checksums; fetch BCR metadata and GitHub archives via GH-Proxy.
# Use one download source without falling back to GitHub or the Google mirror.
rewrite bcr\.bazel\.build/(.*) https://gh-proxy.com/https://raw.githubusercontent.com/bazelbuild/bazel-central-registry/main/$1
rewrite (?:mirror\.bazel\.build/)?github\.com/(.*) https://gh-proxy.com/https://github.com/$1
rewrite codeload\.github\.com/([^/]+)/([^/]+)/tar\.gz/(.*) https://gh-proxy.com/https://github.com/$1/$2/archive/$3.tar.gz
allow gh-proxy.com
# Non-GitHub SDK distributions use their original hosts.
allow www.netlib.org
allow archives.boost.io
block *
