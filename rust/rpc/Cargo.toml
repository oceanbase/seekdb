[package]
name = "rpc"
version = "0.1.0"
edition = "2021"
publish = false
[dependencies]
tonic = { version = "=0.14.6", default-features = false, features = ["transport", "codegen", "router"] }
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "net", "sync", "time"] }
tokio-stream = { version = "=0.1.18", features = ["net"] }
rustls-pki-types = { version = "1", features = ["std"] }
x509-parser = { version = "0.18", default-features = false }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tonic = { version = "=0.14.6", default-features = false, features = ["tls-ring"] }
