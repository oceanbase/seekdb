[package]
name = "sql-nio"
version = "0.1.0"
edition = "2021"
publish = false
description = "Rust reimplementation of seekdb's ObSqlNioImpl network engine, exposed through CXX."

# Accepted deviations from clippy defaults, with reasons. Keep this list short;
# anything not listed here must stay clean under `cargo clippy -- -D warnings`.
[lints.clippy]
# Protocol descriptors cross the language boundary without extra allocations.
too_many_arguments = "allow"

[lib]
name = "sql_nio"
# rlib for tests and Rust consumers. seekdb-rust assembles the production
# static archive so logging and networking share one runtime and allocator.
crate-type = ["rlib"]
test = false

[features]
default = ["native-network"]
native-network = ["dep:mio", "dep:socket2", "dep:libc", "dep:windows-sys"]
memory-transport = []

[dependencies]
cxx = "1"
# flate2 = zlib for the compressed MySQL protocol.
flate2 = "1"
# Direct-indexed storage for the reactor's mio Token -> connection hot table.
slab = "0.4"
# TLS for the MySQL channel. default-features=false drops the aws-lc-rs
# provider; `ring`
# ships pre-generated assembly and needs only the C compiler already required
# by the rest of the build. tls12 stays on: MySQL 5.7-era libmysqlclient never
# negotiates TLS 1.3.
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12"] }
# PEM certificate/key loaders (ServerConfig inputs) live here.
rustls-pki-types = { version = "1", features = ["std"] }
# X.509 metadata parsing stays inside rust-nio. rustls remains the TLS
# handshake/verifier; this crate only turns the already-verified peer DER into
# the account-policy fields exposed by the narrow C ABI.
x509-parser = { version = "0.18", default-features = false }

[target.'cfg(not(target_os = "emscripten"))'.dependencies]
# mio = epoll (Linux) / kqueue (macOS) / IOCP (Windows), no async runtime.
# os-ext: mio::windows::NamedPipe for the per-reactor pending-pipe acceptor.
mio = { version = "1", optional = true, features = ["os-poll", "net", "os-ext"] }
socket2 = { version = "0.6", optional = true, features = ["all"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }

[target.'cfg(all(unix, not(target_os = "emscripten")))'.dependencies]
libc = { version = "0.2", optional = true }

# CreateNamedPipeW for re-armed pipe instances (mio's NamedPipe::new only
# creates the first) plus its error constants.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Pipes",
] }
