[package]
name = "seekdb-rust"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]

[features]
default = ["native-network"]
native-network = ["sql-nio/native-network"]
plugins = ["dep:seekdb-plugin-runtime"]

[dependencies]
sql-nio = { path = "../sql-nio", default-features = false }
logger = { path = "../logger" }
config = { path = "../config" }
local = { path = "../local" }
seekdb-plugin-runtime = { path = "../plugin-runtime", optional = true }
in-process = { path = "../in-process" }
regex-engine = { path = "../regex-engine" }
uuid-generator = { path = "../uuid-generator" }
