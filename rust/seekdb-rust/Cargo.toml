[package]
name = "seekdb-rust"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]

[features]
default = ["native-network"]
native-network = ["sql-nio/native-network"]
native-http = ["dep:http-client"]

[dependencies]
mvt = { path = "../mvt" }
sql-nio = { path = "../sql-nio", default-features = false }
logger = { path = "../logger" }
number-parser = { path = "../number-parser" }
config = { path = "../config" }
local = { path = "../local" }
in-process = { path = "../in-process" }
regex-engine = { path = "../regex-engine" }
xml-parser = { path = "../xml-parser" }
compression = { path = "../compression" }
crypto = { path = "../crypto" }
spatial-covering = { path = "../spatial-covering" }
uuid-generator = { path = "../uuid-generator" }
http-client = { path = "../http-client", optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
standby-rpc = { path = "../standby-rpc" }
