# Instance parameter declarations, in display order.
- name: data_dir
  type: STR
  default: "store"
  section: SSTABLE
  edit_level: READONLY
  description: "the directory for the data file"

- name: redo_dir
  type: STR
  default: ""
  section: SSTABLE
  edit_level: READONLY
  description: "the directory for the redo/clog file"

- name: datafile_size
  type: CAP
  default: "32M"
  range: "[0M,)"
  section: SSTABLE
  edit_level: DYNAMIC_EFFECTIVE
  description: "size of the data file. Range: [0, +∞)"

- name: datafile_next
  type: CAP
  default: "0M"
  range: "[0M,)"
  section: SSTABLE
  edit_level: DYNAMIC_EFFECTIVE
  description: "the auto extend step. 0 means using adaptive extend step size. Range: [0, +∞)"

- name: datafile_maxsize
  type: CAP
  default: "1T"
  range: "[0M,)"
  section: SSTABLE
  edit_level: DYNAMIC_EFFECTIVE
  description: "the auto extend max size. Range: [0, +∞)"

- name: datafile_disk_percentage
  type: INT
  default: "0"
  range: "[0,99]"
  section: SSTABLE
  edit_level: DYNAMIC_EFFECTIVE
  description: "the percentage of disk space used by the data files. Range: [0,99] in integer"

- name: _datafile_usage_upper_bound_percentage
  type: INT
  default: "90"
  range: "[5,99]"
  section: SSTABLE
  edit_level: DYNAMIC_EFFECTIVE
  description: "the percentage of disk space usage upper bound to trigger datafile extend. Range: [5,99] in integer"

- name: enable_rpc_service
  type: BOOL
  default: "False"
  section: OBSERVER
  edit_level: DYNAMIC_EFFECTIVE
  description: "specifies whether the standby gRPC service is enabled. Enabling takes effect dynamically; disabling takes effect after restart. Value: True: enabled False: disabled"

- name: enable_rpc_tls
  type: BOOL
  default: "False"
  section: OBSERVER
  edit_level: STATIC_EFFECTIVE
  description: "specifies whether mutual TLS (mTLS) is enabled for inter-node RPC communication. When True, certificates must exist in the wallet directory. Value: True: enabled False: disabled"

- name: rpc_port
  type: INT
  default: "2882"
  range: "(1024,65536)"
  section: OBSERVER
  edit_level: DYNAMIC_EFFECTIVE
  description: "the port number for RPC protocol. Range: (1024, 65536) in integer"

- name: mysql_port
  type: INT
  default: "2881"
  range: "(1024,65536)"
  section: OBSERVER
  edit_level: DYNAMIC_EFFECTIVE
  description: "port number for mysql connection. Range: (1024, 65536) in integer"

- name: mysql_port_mode
  type: STR
  default: "specified"
  section: OBSERVER
  edit_level: DYNAMIC_EFFECTIVE
  description: "port mode for mysql connection: specified, random, or disabled"

- name: internal_sql_execute_timeout
  type: TIME
  default: "30s"
  range: "[1000us, 1h]"
  section: OBSERVER
  edit_level: DYNAMIC_EFFECTIVE
  description: "the number of microseconds an internal DML request is permitted to execute before it is terminated. Range: [1000us, 1h]"

- name: net_thread_count
  type: INT
  default: "0"
  range: "[0,128]"
  section: OBSERVER
  edit_level: STATIC_EFFECTIVE
  description: "the number of MySQL I/O threads. Range: [0, 128] in integer, 0 selects an adaptive value"

- name: server_task_queue_size
  type: INT
  default: "16384"
  range: "[1024,]"
  section: OBSERVER
  edit_level: DYNAMIC_EFFECTIVE
  description: "the size of the local server runtime task queue. Range: [1024,+∞)"

- name: memory_budget
  type: CAP_WITH_CHECKER
  default: "0M"
  range: "[0M,)"
  section: OBSERVER
  edit_level: DYNAMIC_EFFECTIVE
  description: "the logical memory budget used to size caches and buffers. 0 targets 80% of cgroup or physical memory while reserving at least 1G for the system when possible. The minimum automatic value is 1G. Range: 0, [1G,)."
  checker: "common::MemoryBudgetConfigChecker"

- name: memory_limit
  type: CAP_WITH_CHECKER
  default: "0M"
  range: "[0M,)"
  section: OBSERVER
  edit_level: DYNAMIC_EFFECTIVE
  description: "deprecated compatibility parameter. The configured value is accepted and persisted, but is ignored by memory sizing and memory control. Range: 0, [1G,)."
  checker: "common::MemoryBudgetConfigChecker"

- name: kvcache_memory_limit
  type: CAP_WITH_CHECKER
  default: "0M"
  range: "[0M,1T]"
  section: RUNTIME
  edit_level: DYNAMIC_EFFECTIVE
  description: "the maximum memory used by KV cache. 0 derives the limit from memory_budget. The automatic value is min(1T, 40% of memory_budget). A dynamic increase cannot exceed the capacity reserved at startup. Range: [0M,1T]."
  checker: "common::KVCacheMemoryLimitConfigChecker"

- name: memstore_memory_limit
  type: CAP
  default: "0M"
  range: "[0M,)"
  section: RUNTIME
  edit_level: DYNAMIC_EFFECTIVE
  description: "the maximum memory used by Memstore. 0 derives the limit from memory_budget. The automatic value is 50% of memory_budget. Range: [0M,)."

- name: vector_memory_limit
  type: CAP
  default: "0M"
  range: "[0M,)"
  section: RUNTIME
  edit_level: DYNAMIC_EFFECTIVE
  description: "the maximum memory used by the vector module. 0 derives the limit from effective memory, which is the smaller of physical memory and a finite cgroup memory limit. The automatic value is 50% of effective memory. The Vector allocator enforces this module limit independently of the TxShare aggregate limit. Range: [0M,)."

- name: cpu_count
  type: INT
  default: "0"
  range: "[0,]"
  section: OBSERVER
  edit_level: DYNAMIC_EFFECTIVE
  description: "the number of CPU\\'s in the system. If this parameter is set to zero, the number will be set according to sysconf; otherwise, this parameter is used. Range: [0,+∞) in integer"

- name: trace_log_slow_query_watermark
  type: TIME
  default: "1s"
  range: "[1ms,]"
  section: OBSERVER
  edit_level: DYNAMIC_EFFECTIVE
  description: "the threshold of execution time (in milliseconds) of a query beyond which it is considered to be \\'slow query\\'. Range: [1ms,+∞)"

- name: enable_record_trace_log
  type: BOOL
  default: "True"
  section: OBSERVER
  edit_level: DYNAMIC_EFFECTIVE
  description: "specifies whether to always record the trace log. The default value is True."

- name: max_string_print_length
  type: INT
  default: "500"
  range: "[0,]"
  section: OBSERVER
  edit_level: DYNAMIC_EFFECTIVE
  description: "truncate very long string when printing to log file. Range:[0,]"

- name: enable_record_trace_id
  type: BOOL
  default: "False"
  section: OBSERVER
  edit_level: DYNAMIC_EFFECTIVE
  description: "specifies whether record app trace id is turned on."

- name: enable_rich_error_msg
  type: BOOL
  default: "false"
  section: OBSERVER
  edit_level: DYNAMIC_EFFECTIVE
  description: "specifies whether add ip:port, time and trace id to user error message. The default value is FALSE."

- name: debug_sync_timeout
  type: TIME
  default: "0"
  range: "[0,)"
  section: OBSERVER
  edit_level: DYNAMIC_EFFECTIVE
  description: "Enable the debug sync facility and optionally specify a default wait timeout in micro seconds. A zero value keeps the facility disabled, Range: [0, +∞]"

- name: dead_socket_detection_timeout
  type: TIME
  default: "3s"
  range: "[0s,2h]"
  section: OBSERVER
  edit_level: DYNAMIC_EFFECTIVE
  description: "specify a tcp_user_timeout for RFC5482. A zero value makes the option disabled, Range: [0, 2h]"

- name: enable_perf_event
  type: BOOL
  default: "True"
  section: OBSERVER
  edit_level: DYNAMIC_EFFECTIVE
  description: "specifies whether to enable perf event feature. The default value is True."

- name: schema_history_expire_time
  type: TIME
  default: "7d"
  range: "[1m, 30d]"
  section: OBSERVER
  edit_level: DYNAMIC_EFFECTIVE
  description: "the expire time for schema history, from 1min to 30days, with default 7days. Range: [1m, 30d]"

- name: default_compress_func
  type: STR_WITH_CHECKER
  default: "zstd_1.3.8"
  section: OBSERVER
  edit_level: DYNAMIC_EFFECTIVE
  description: "default compress function name for create new table, values: none, zlib_1.0, zstd_1.3.8"
  checker: "common::ObConfigCompressFuncChecker"

- name: default_row_format
  type: STR_WITH_CHECKER
  default: "dynamic"
  section: OBSERVER
  edit_level: DYNAMIC_EFFECTIVE
  description: "default row format in mysql mode"
  checker: "common::ObConfigRowFormatChecker"

- name: storage_rowsets_size
  type: INT
  default: "8192"
  range: "(0,1048576]"
  section: RUNTIME
  edit_level: DYNAMIC_EFFECTIVE
  description: "the row number processed by vectorized storage engine within one batch. Range: (0,1048576]"

- name: weak_read_version_refresh_interval
  type: TIME
  default: "1000ms"
  range: "[50ms,)"
  section: OBSERVER
  edit_level: DYNAMIC_EFFECTIVE
  description: "the time interval to refresh cluster weak read version Range: [50ms, +∞)"

- name: syslog_level
  type: LOG_LEVEL
  default: "@DEFAULT_LOG_LEVEL@"
  section: OBSERVER
  edit_level: DYNAMIC_EFFECTIVE
  description: "specifies the current level of logging. There are DEBUG, TRACE, WDIAG, EDIAG, INFO, WARN, ERROR, seven different log levels."
  checker: "ObConfigLogLevelChecker"

- name: syslog_io_bandwidth_limit
  type: CAP
  default: "5MB"
  section: OBSERVER
  edit_level: DYNAMIC_EFFECTIVE
  description: "Syslog IO bandwidth limitation, exceeding syslog would be truncated. Use 0 to disable ERROR log."

- name: diag_syslog_per_error_limit
  type: INT
  default: "200"
  range: "[0,]"
  section: OBSERVER
  edit_level: DYNAMIC_EFFECTIVE
  description: "DIAG syslog limitation for each error per second, exceeding syslog would be truncated"

- name: max_syslog_file_count
  type: INT_WITH_CHECKER
  default: "2"
  section: OBSERVER
  edit_level: DYNAMIC_EFFECTIVE
  description: "specifies the maximum number of the log files that can co-exist before the log file recycling kicks in. Each log file can occupy at most 256MB disk space. When this value is set to 0, no log file will be removed. Range: [0, +∞) in integer"
  checker: "common::ObConfigMaxSyslogFileCountChecker"

- name: enable_async_syslog
  type: BOOL
  default: "True"
  section: OBSERVER
  edit_level: DYNAMIC_EFFECTIVE
  description: "specifies whether use async log for observer.log, elec.log and rs.log"

- name: syslog_disk_size
  type: CAP
  default: "0M"
  range: "[0M,)"
  section: OBSERVER
  edit_level: DYNAMIC_EFFECTIVE
  description: "the size of disk space used by the syslog files. Range: [0, +∞)"

- name: syslog_compress_func
  type: STR_WITH_CHECKER
  default: "none"
  section: OBSERVER
  edit_level: DYNAMIC_EFFECTIVE
  description: "compress function name for syslog files, values: none, zstd_1.3.8"
  checker: "common::ObConfigSyslogCompressFuncChecker"

- name: syslog_file_uncompressed_count
  type: INT_WITH_CHECKER
  default: "0"
  section: OBSERVER
  edit_level: DYNAMIC_EFFECTIVE
  description: "specifies the minimum number of the syslog files that will not be compressed. Each syslog file can occupy at most 256MB disk space. When this value is set to 0, all syslog file may be compressed. Range: [0, +∞) in integer"
  checker: "common::ObConfigSyslogFileUncompressedCountChecker"

- name: cache_wash_threshold
  type: CAP
  default: "64M"
  range: "[0B,]"
  section: OBSERVER
  edit_level: DYNAMIC_EFFECTIVE
  description: "size of remaining memory at which cache eviction will be triggered. Range: [0,+∞)"

- name: memory_chunk_cache_size
  type: CAP
  default: "0M"
  range: "[0M,]"
  section: OBSERVER
  edit_level: DYNAMIC_EFFECTIVE
  description: "the maximum size of memory cached by memory chunk cache. Range: [0M,], 0 stands for adaptive"

- name: enable_sql_operator_dump
  type: BOOL
  default: "True"
  section: OBSERVER
  edit_level: DYNAMIC_EFFECTIVE
  description: "specifies whether sql operators (sort/hash join/material/window function/interm result/...) allowed to write to disk"

- name: _chunk_row_store_mem_limit
  type: CAP
  default: "0M"
  range: "[0M,]"
  section: OBSERVER
  edit_level: DYNAMIC_EFFECTIVE
  description: "the maximum size of memory used by ChunkRowStore, 0 means follow operator's setting. Range: [0, +∞)"

- name: _sort_area_size
  type: CAP
  default: "32M"
  range: "[2M,]"
  section: OBSERVER
  edit_level: DYNAMIC_EFFECTIVE
  description: "size of maximum memory that could be used by SORT. Range: [2M,+∞)"

- name: _hash_area_size
  type: CAP
  default: "32M"
  range: "[4M,]"
  section: OBSERVER
  edit_level: DYNAMIC_EFFECTIVE
  description: "size of maximum memory that could be used by HASH JOIN. Range: [4M,+∞)"

- name: _enable_partition_level_retry
  type: BOOL
  default: "True"
  section: OBSERVER
  edit_level: DYNAMIC_EFFECTIVE
  description: "specifies whether allow the partition level retry when the leader changes"

- name: _enable_defensive_check
  type: INT_WITH_CHECKER
  default: "1"
  section: OBSERVER
  edit_level: DYNAMIC_EFFECTIVE
  description: "specifies whether allow to do some defensive checks when the query is executed, 0 means defensive check is disabled, 1 means normal defensive check is enabled, 2 means more strict defensive check is enabled, such as check partition id validity"
  checker: "common::ObConfigEnableDefensiveChecker"

- name: _sql_insert_multi_values_split_opt
  type: BOOL
  default: "True"
  section: OBSERVER
  edit_level: DYNAMIC_EFFECTIVE
  description: "True means that the split + batch optimization for inserting multiple rows of the insert values ​​statement can be done"

- name: _min_malloc_sample_interval
  type: INT
  default: "16"
  range: "[1, 10000]"
  section: OBSERVER
  edit_level: DYNAMIC_EFFECTIVE
  description: "the min malloc times between two samples, which is not more than _max_malloc_sample_interval. 10000 means not to sample any malloc, Range: [1, 10000]"

- name: _max_malloc_sample_interval
  type: INT
  default: "256"
  range: "[1, 10000]"
  section: OBSERVER
  edit_level: DYNAMIC_EFFECTIVE
  description: "the max malloc times between two samples, which is not less than _min_malloc_sample_interval. 1 means to sample all malloc, Range: [1, 10000]"

- name: _enable_values_table_folding
  type: BOOL
  default: "True"
  section: OBSERVER
  edit_level: DYNAMIC_EFFECTIVE
  description: "whether enable values statement folds self params"

- name: spill_compression_codec
  type: STR_WITH_CHECKER
  default: "NONE"
  section: OBSERVER
  edit_level: DYNAMIC_EFFECTIVE
  description: "specific the compression algorithm type to compress the spilled data in temp block store during the sql execution phase. The supported compression codec is ZSTD. NONE means no compression.The default value is NONE."
  checker: "common::ObConfigSQLSpillCompressionCodecChecker"

- name: max_stale_time_for_weak_consistency
  type: TIME_WITH_CHECKER
  default: "5s"
  range: "[5s,)"
  section: RUNTIME
  edit_level: DYNAMIC_EFFECTIVE
  description: "the max data stale time that cluster weak read version behind current timestamp,no smaller than weak_read_version_refresh_interval, range: [5s, +∞)"
  checker: "common::ObConfigStaleTimeChecker"

- name: enable_monotonic_weak_read
  type: BOOL
  default: "false"
  section: RUNTIME
  edit_level: DYNAMIC_EFFECTIVE
  description: "specifies observer supportting atomicity and monotonic order read"

- name: server_cpu_quota_min
  type: DBL
  default: "0"
  range: "[0,16]"
  section: RUNTIME
  edit_level: DYNAMIC_EFFECTIVE
  description: "the minimum number of vCPUs allocated to the server runtime. 0 stands for adaptive. Range: [0, 16]"

- name: server_cpu_quota_max
  type: DBL
  default: "0"
  range: "[0,16]"
  section: RUNTIME
  edit_level: DYNAMIC_EFFECTIVE
  description: "the maximum number of vCPUs allocated to the server runtime. 0 stands for adaptive. Range: [0, 16]"

- name: workers_per_cpu_quota
  type: INT
  default: "10"
  range: "[2,20]"
  section: RUNTIME
  edit_level: DYNAMIC_EFFECTIVE
  description: "the ratio(integer) between the number of system allocated workers vs the maximum number of threads that can be scheduled concurrently. Range: [2, 20]"

- name: _ob_max_thread_num
  type: INT
  default: "0"
  range: "[0,10000)"
  section: RUNTIME
  edit_level: DYNAMIC_EFFECTIVE
  description: "ob max thread number upper limit of observer thread count. Range: [0, 10000), 0 means no limit."

- name: cpu_quota_concurrency
  type: DBL
  default: "10"
  range: "[1,20]"
  section: RUNTIME
  edit_level: DYNAMIC_EFFECTIVE
  description: "max allowed concurrency for 1 CPU quota. Range: [1,20]"

- name: px_workers_per_cpu_quota
  type: INT
  default: "10"
  range: "[0,20]"
  section: RUNTIME
  edit_level: DYNAMIC_EFFECTIVE
  description: "the ratio(integer) between the number of system allocated px workers vs the maximum number of threads that can be scheduled concurrently. Range: [0, 20]"

- name: undo_retention
  type: INT
  default: "1800"
  range: "[0, 4294967295]"
  section: RUNTIME
  edit_level: DYNAMIC_EFFECTIVE
  description: "the low threshold value of undo retention. The system retains undo for at least the time specified in this config when active txn protection is banned. Range: [0, 4294967295]"

- name: _mvcc_gc_using_min_txn_snapshot
  type: BOOL
  default: "True"
  section: RUNTIME
  edit_level: DYNAMIC_EFFECTIVE
  description: "specifies enable mvcc gc using active txn snapshot"

- name: _rowsets_target_maxsize
  type: INT
  default: "524288"
  range: "[262144, 8388608]"
  section: RUNTIME
  edit_level: DYNAMIC_EFFECTIVE
  description: "the size of the memory reserved for vectorized sql engine. Range: [262144, 8388608]"

- name: _rowsets_max_rows
  type: INT
  default: "256"
  range: "[0, 65535]"
  section: RUNTIME
  edit_level: DYNAMIC_EFFECTIVE
  description: "the row number processed by vectorized sql engine within one batch. Range: [0, 65535]"

- name: _ctx_memory_limit
  type: STR_WITH_CHECKER
  default: ""
  section: RUNTIME
  edit_level: DYNAMIC_EFFECTIVE
  description: "specifies server runtime context memory limits."
  checker: "common::ObCtxMemoryLimitChecker"

- name: _enable_convert_real_to_decimal
  type: BOOL
  default: "False"
  section: RUNTIME
  edit_level: DYNAMIC_EFFECTIVE
  description: "specifies whether convert column type float(M,D), double(M,D) to decimal(M,D) in DDL"

- name: _enable_decimal_int_type
  type: BOOL
  default: "True"
  section: RUNTIME
  edit_level: DYNAMIC_EFFECTIVE
  description: "specifies wether use decimal_int type as backend for decimal values"

- name: _optimizer_ads_time_limit
  type: INT
  default: "10"
  range: "[0, 300]"
  section: RUNTIME
  edit_level: DYNAMIC_EFFECTIVE
  description: "the maximum optimizer dynamic sampling time limit. Range: [0, 300]"

- name: _hash_join_enabled
  type: BOOL
  default: "True"
  section: RUNTIME
  edit_level: DYNAMIC_EFFECTIVE
  description: "enable/disable hash join"

- name: _optimizer_sortmerge_join_enabled
  type: BOOL
  default: "True"
  section: RUNTIME
  edit_level: DYNAMIC_EFFECTIVE
  description: "enable/disable merge join"

- name: _nested_loop_join_enabled
  type: BOOL
  default: "True"
  section: RUNTIME
  edit_level: DYNAMIC_EFFECTIVE
  description: "enable/disable nested loop join"

- name: _enable_mysql_compatible_dates
  type: BOOL
  default: "True"
  section: RUNTIME
  edit_level: DYNAMIC_EFFECTIVE
  description: "Specifies whether to use MySQL-compatible date format that allows for invalid dates."

- name: _min_const_integer_precision
  type: INT
  default: "1"
  range: "[1, 20]"
  section: RUNTIME
  edit_level: DYNAMIC_EFFECTIVE
  description: "the minimum precision of integer constant"

- name: _lob_rowsets_max_rows
  type: INT
  default: "65535"
  range: "[1, 65535]"
  section: RUNTIME
  edit_level: DYNAMIC_EFFECTIVE
  description: "max batch size of physical plan with lob data"

- name: _use_hash_rollup
  type: STR_WITH_CHECKER
  default: "AUTO"
  section: RUNTIME
  edit_level: DYNAMIC_EFFECTIVE
  description: "policy of hash based rollup plan:AUTO: hash rollup plan is up to optimizer;FORCED: hash rollup plan is used by default;DISABLED: hash rollup plan is disabled;"
  checker: "common::ObConfigEnableHashRollupChecker"

- name: _enable_constant_type_demotion
  type: BOOL
  default: "True"
  section: RUNTIME
  edit_level: DYNAMIC_EFFECTIVE
  description: "Controls whether to enable constant type demotion to optimize comparisons between constants and columns by downgrading the constant's type to match the column's type."

- name: _non_standard_comparison_level
  type: STR_WITH_CHECKER
  default: "NONE"
  section: RUNTIME
  edit_level: DYNAMIC_EFFECTIVE
  description: "Enable non-standard comparisons to optimize filtering by aligning constants with column types. Currently only affects comparisons between string columns and int constants NONE: all comparison types use standard comparison. EQUAL: non-standard comparisons rules will applied in equal conditions. RANGE: non-standard comparisons rules will applied in range conditions. "
  checker: "common::ObConfigNonStdCmpLevelChecker"

- name: _memstore_limit_percentage
  type: INT
  default: "0"
  range: "[0, 100)"
  section: RUNTIME
  edit_level: DYNAMIC_EFFECTIVE
  description: "Deprecated compatibility parameter. The configured value is accepted and persisted, but is ignored by memstore sizing and memory control."

- name: freeze_trigger_percentage
  type: INT
  default: "20"
  range: "(0, 100)"
  section: RUNTIME
  edit_level: DYNAMIC_EFFECTIVE
  description: "the threshold of the size of the mem store when freeze will be triggered. Rang:(0,100)"

- name: writing_throttling_trigger_percentage
  type: INT
  default: "60"
  range: "(0, 100]"
  section: TRANS
  edit_level: DYNAMIC_EFFECTIVE
  description: "the threshold of the size of the mem store when writing_limit will be triggered. Rang:(0,100]. setting 100 means turn off writing limit"

- name: data_disk_write_limit_percentage
  type: INT
  default: "0"
  range: "[0, 100)"
  section: RUNTIME
  edit_level: DYNAMIC_EFFECTIVE
  description: "used to stop user write operations. When the user data disk reaches this watermark, SQL requests will report that the disk is full. The configuration should be greater than data_disk_usage_limit_percentage, with the recommended setting being: (1 - memstore_limit_size / data_disk_size) * 100%"

- name: writing_throttling_maximum_duration
  type: TIME
  default: "2h"
  range: "[1s, 3d]"
  section: TRANS
  edit_level: DYNAMIC_EFFECTIVE
  description: "maximum duration of writting throttling(in minutes), max value is 3 days"

- name: plan_cache_evict_interval
  type: TIME
  default: "5s"
  range: "[0s,)"
  section: RUNTIME
  edit_level: DYNAMIC_EFFECTIVE
  description: "time interval for periodic plan cache eviction. Range: [0s, +∞)"

- name: default_progressive_merge_num
  type: INT
  default: "0"
  range: "[0,)"
  section: RUNTIME
  edit_level: DYNAMIC_EFFECTIVE
  description: "default progressive_merge_num for a newly created table. Range:[0,)"

- name: _parallel_min_message_pool
  type: CAP
  default: "16M"
  range: "[16M, 8G]"
  section: RUNTIME
  edit_level: DYNAMIC_EFFECTIVE
  description: "DTL message buffer pool reserve the mininum size after extend the size. Range: [16M,8G]"

- name: _parallel_server_sleep_time
  type: DBL
  default: "1"
  range: "[0, 2000]"
  section: RUNTIME
