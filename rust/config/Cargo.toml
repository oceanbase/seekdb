[package]
name = "config"
version = "0.1.0"
edition = "2021"
publish = false
description = "Durable instance parameter configuration for seekdb"

[lib]
name = "config"
crate-type = ["rlib"]

[build-dependencies]
cxx-build = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"

[dependencies]
cxx = "1"
kv = { path = "../kv" }
local = { path = "../local" }
