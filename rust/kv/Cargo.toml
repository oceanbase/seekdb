[package]
name = "kv"
version = "0.1.0"
edition = "2021"
publish = false
description = "Local transactional storage with a disk backed copy-on-write B+ tree"

[lib]
crate-type = ["rlib"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
