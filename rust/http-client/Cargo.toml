[package]
name = "http-client"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
cxx = "=1.0.202"

[target.'cfg(not(target_os = "emscripten"))'.dependencies]
curl = { version = "=0.4.49", default-features = false, features = ["static-curl", "rustls", "zlib-ng-compat"] }
curl-sys = { version = "=0.4.84", default-features = false }
rustls-ffi = { version = "=0.15.7", default-features = false, features = ["aws-lc-rs"] }

[target.'cfg(all(not(target_os = "emscripten"), not(target_os = "ios")))'.dependencies]
aws-lc-sys = { version = "=0.47.0", features = ["all-bindings"] }

[target.'cfg(target_os = "ios")'.dependencies]
aws-lc-sys = { version = "=0.47.0", features = ["all-bindings", "bindgen"] }

[target.'cfg(not(target_os = "emscripten"))'.dev-dependencies]
rustls = { version = "=0.23.46", default-features = false, features = ["std", "tls12", "aws-lc-rs"] }
