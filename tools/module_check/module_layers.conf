# Source-dependency policy. Numeric layers guard foundational code; named
# domains guard implementation boundaries that cannot be represented by a
# single numeric ordering (notably query versus data plane).
#
# [targets] entries are: <identity(path)> <layer> [@include-prefix]
# [domains] entries are: <domain-name> <physical-path>
# [allowed_domain_edges] entries are: <source-domain> -> <target-domain>
# [bridge_domain_edges] are bridge-to-implementation edges tracked by an exact
# non-growing baseline. [bridge_consumer_domain_edges] separately tracks every
# implementation caller of a bridge, preventing existing umbrella headers
# from gaining new consumers without adding implementation includes.

# [scanned] covers every first-level module and API root. Their layers are in
# [targets] below (a source is also a target). Existing upward edges live in an
# exact migration-debt baseline; no module is exempt from detecting new edges.
[scanned]
src/oblib/easy
src/oblib/lib
src/oblib/common
src/oblib/rpc
src/oblib/grpc
src/share
src/data_plane
src/query
src/sql
src/storage
src/logservice
src/objit
src/pl
src/libtable
src/observer
src/rootserver

# [targets] full module layer registry (identity+layer); includes the scanned ones. purified/quarantine are comment groups only.
[targets]
src/oblib/easy                                                       0
src/oblib/lib                                                 0
src/oblib/common                                              1
src/oblib/rpc                                                 1
src/oblib/grpc                                                1
src/share                                                          2
src/data_plane                                                     2  @data_plane
src/query                                                          2  @query
# Transitional bridge headers are an explicit quarantine for the broad
# implementation-shaped interfaces inherited by the initial isolation pass.
# They remain L3 debt even though their physical path is under an API root.
src/data_plane/api/data_plane/bridge                               3  @data_plane/bridge
src/query/api/query/bridge                                         3  @query/bridge
src/sql                                                            3
src/storage                                                        3
src/logservice                                                     3
src/objit                                                          3
# objit/common/ob_item_type.h is parser vocabulary consumed by Query only;
# Share-facing modules must translate it to their own narrow domain enums.
src/objit/include/objit/common                                     1  @objit/common
src/pl                                                             4
src/libtable                                                       4
src/observer                                                       5
src/observer/composition                                           5
src/rootserver                                                     5
# --- purified: single files pulled to a lower layer (longest prefix overrides their owning dir); ideal end-state is physically sinking the file ---
# Misfiled upper-layer value types that are logically L1/L2 follow.
src/sql/executor/ob_execution_id.h                                 1
src/sql/executor/ob_job_id.h                                       1
# tablet status/constant value type, depends only on lib+share, logically marked L2 (physical relocation pending Phase2)
src/storage/tablet/ob_tablet_status.h                              2
# tablet create/delete MDS user data (value type+enum), depends only on lib+share+the above two, logically marked L2
src/storage/tablet/ob_tablet_create_delete_mds_user_data.h         2
# plan cache namespace enum registration header (X-macro), depends only on lib+share config+pc_ref_handle, logically marked L2
src/sql/plan_cache/ob_pc_ref_handle.h                              2
src/sql/plan_cache/ob_lib_cache_register.h                         2
src/storage/tablelock/ob_table_lock_def.h                          2
# tablelock owner pure value type (enum+ID class), depends only on lib+def header, logically marked L2
src/storage/tablelock/ob_table_lock_owner_id.h                     2
# blocksstable macro-block ID pure value identifier type (same family as ObTabletID/ObTransID), depends only on lib+share define, logically marked L2
src/storage/blocksstable/ob_macro_block_id.h                       2
# SS fd cache handle struct (92 lines, depends only on lib+macro_block_id), io_define holds it by value, logically marked L2
close_modules/shared_storage/storage/shared_storage/ob_ss_fd_cache_struct.h 2  @storage/shared_storage/ob_ss_fd_cache_struct.h
# pl object id micro-utility pure header (depends only on lib+share rc), logically marked L2
src/pl/ob_pl_object_id_util.h                                      2
# local session variable value container (105 lines, depends only on lib+common+share sysvar types), schema embedded by value, logically marked L2
# RS job-type pure enum, logically marked L2
src/rootserver/ob_rs_job_type.h                                    2
# log-file spec pure struct, logically marked L2
src/storage/blocksstable/ob_log_file_spec.h                        2
# MTL bridge template helper (125 lines, depends only on lib+share rc; twinned with tenant_base framework), logically marked L2
src/observer/omt/ob_tenant_mtl_helper.h                            2
# macro-block handle (depends only on lib+share io+macro_id[L2]), io calibration held by value, logically marked L2
src/storage/blocksstable/ob_macro_block_handle.h                   2
# multi-source data unit pure interface+enum (depends only on lib), inherited by autoincrement, logically marked L2
src/storage/memtable/ob_i_multi_source_data_unit.h                 2
# storage meta object pure interface (8 lines zero deps), logically marked L2
src/storage/meta_mem/ob_i_storage_meta_obj.h                       2
# --- quarantine: subdir raised to L9 to suppress violations (not an architectural fact, debt, to be cleared to zero) ---
#     physical relocation/final placement/naming pending Phase 2 (after share base lands). share base->them still counts as a violation, to be cleared.

# Architectural domains are physical ownership boundaries. A path belongs to
# the longest matching entry. Cross-domain includes are forbidden unless the
# exact directed edge is declared below.
[domains]
composition src/observer/composition
query src/sql
data_plane src/storage
data_plane src/logservice
data_plane_api src/data_plane
query_api src/query
data_plane_bridge src/data_plane/api/data_plane/bridge
query_bridge src/query/api/query/bridge

[allowed_domain_edges]
composition -> query
composition -> data_plane
composition -> data_plane_api
query -> query_api
query -> data_plane_api
data_plane -> data_plane_api
data_plane -> query_api

[bridge_domain_edges]
data_plane_bridge -> data_plane
query_bridge -> query

[bridge_consumer_domain_edges]
query -> data_plane_bridge
data_plane -> query_bridge
